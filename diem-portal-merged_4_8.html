/* ============================================================
   DAY OFF — approved absences feed the calendar & capacity
   ============================================================ */
function dayOffOverlapsDate(d, date){ return date >= fromISO(d.startDate) && date <= fromISO(d.endDate); }
function approvedDayOffOn(personId, date){
  return DAYOFF.find(d=> d.person===personId && d.status==='approved' && dayOffOverlapsDate(d,date));
}
function isApprovedDayOff(personId, date){ return !!approvedDayOffOn(personId, date); }
function pendingDayOffRequests(){ return DAYOFF.filter(d=>d.status==='pending'); }
function unseenDayOffDecisions(personId){ return DAYOFF.filter(d=>d.person===personId && d.status!=='pending' && d.employeeSeen===false); }
function dayOffDaysInWindow(personId, windowStart, windowEnd){
  let days = 0;
  DAYOFF.filter(d=>d.person===personId && d.status==='approved').forEach(d=>{
    const s = fromISO(d.startDate), e = fromISO(d.endDate);
    let cursor = new Date(Math.max(s, windowStart));
    const end = new Date(Math.min(e, windowEnd));
    while(cursor<=end){ if(!isWeekend(cursor)) days++; cursor = addDays(cursor,1); }
  });
  return days;
}

/* ============================================================
   SMART RECOMMENDATIONS
   ============================================================ */
/* Every recommendation carries a concrete `action` the platform can execute directly —
   Apply performs the mutation, persists it, and re-renders, so every dependent view
   (projects, cards, kanban, planning, matrix, team, dashboards) picks it up immediately
   since they all compute live from the same TASKS/PROJECTS state. */
function generateRecommendations(scopePersonId){
  const recs = [];
  const capRoster = capacityRoster().map(p=>({person:p, cap:computeCapacity(p.id)}));
  const push = (rec)=> recs.push(Object.assign({id:'rec_'+recs.length+'_'+(rec.action?rec.action.type:'info')}, rec));

  // 1) Overloaded people -> reassign a not-started task to someone with spare capacity
  capRoster.filter(r=>r.cap.band==='overloaded').forEach(r=>{
    const candidateTask = TASKS.filter(tk=>tk.assignee===r.person.id && tk.status==='not-started')
      .sort((a,b)=>a.due-b.due)[0];
    const available = capRoster.filter(o=>o.person.id!==r.person.id && o.cap.band==='available')
      .sort((a,b)=>a.cap.pct-b.cap.pct)[0];
    if(candidateTask && available){
      push({
        severity:'high', people:[r.person.id, available.person.id], project:candidateTask.project,
        text:`<b>${esc(r.person.name)}</b> is overloaded (${r.cap.pct}% of capacity). Reassign <b>${esc(candidateTask.name)}</b> to <b>${esc(available.person.name)}</b>, who has capacity to spare (${available.cap.pct}%).`,
        applyText:`Reassign "${candidateTask.name}" from ${r.person.name} to ${available.person.name}.`,
        action:{type:'reassign-task', taskId:candidateTask.id, toPersonId:available.person.id}
      });
    }
  });

  // 2) Overloaded owner on an at-risk/blocked project's in-progress task with a single assignee -> add support
  capRoster.filter(r=>r.cap.band==='overloaded'||r.cap.band==='needs-support').forEach(r=>{
    const heavyTask = TASKS.filter(tk=>tk.assignee===r.person.id && tk.status==='in-progress' && !tk.assignee2)
      .sort((a,b)=>a.due-b.due)[0];
    if(!heavyTask) return;
    const helper = capRoster.filter(o=>o.person.id!==r.person.id && ['available','balanced'].includes(o.cap.band) && !isAssignedTo(heavyTask,o.person.id))
      .sort((a,b)=>a.cap.pct-b.cap.pct)[0];
    if(helper){
      push({
        severity:'medium', people:[r.person.id, helper.person.id], project:heavyTask.project,
        text:`<b>${esc(heavyTask.name)}</b> is running heavy for <b>${esc(r.person.name)}</b>. Add <b>${esc(helper.person.name)}</b> as support (${helper.cap.pct}% capacity used).`,
        applyText:`Add ${helper.person.name} as a second assignee on "${heavyTask.name}".`,
        action:{type:'add-support', taskId:heavyTask.id, toPersonId:helper.person.id}
      });
    }
  });

  // 3) Blocked projects with a logged, owned blocker -> escalate urgency so it surfaces for management
  PROJECTS.forEach(p=>{
    if(computeHealth(p)!=='blocked') return;
    const openB = openBlockersFor(p.id)[0];
    if(openB && openB.urgency!=='high'){
      push({severity:'high', people:[openB.owner].filter(Boolean), project:p.id,
        text:`<b>${esc(p.name)}</b> is blocked — "${esc(openB.title)}". ${esc(openB.actionNeeded)}`,
        applyText:`Mark this blocker as high urgency so it surfaces for immediate attention.`,
        action:{type:'escalate-blocker', blockerId:openB.id}});
    }
  });

  // 4) Deadline close + progress low -> bump the project's next task to high priority so it surfaces
  PROJECTS.forEach(p=>{
    const pct = projectProgress(p);
    const daysToEnd = dayDiff(TODAY, fromISO(toISOMaybe(p.end)));
    if(daysToEnd>=0 && daysToEnd<=14 && pct<60 && computeHealth(p)!=='blocked'){
      const next = nextActionFor(p);
      if(next && next.priority!=='high'){
        push({severity:'medium', people:[p.owner], project:p.id,
          text:`<b>${esc(p.name)}</b> is due in ${daysToEnd} day${daysToEnd===1?'':'s'} at only ${pct}% progress. Raise the priority on <b>${esc(next.name)}</b> so it gets attention now.`,
          applyText:`Set the priority of "${next.name}" to High.`,
          action:{type:'reprioritize-task', taskId:next.id, priority:'high'}});
      }
    }
  });

  // 5) Tasks due very soon still at medium/low priority for someone with urgent-task pressure -> reprioritize
  capRoster.filter(r=>r.cap.reasons.some(rs=>rs.tag==='urgent')).forEach(r=>{
    const soonTask = TASKS.filter(tk=>isAssignedTo(tk,r.person.id) && tk.status!=='done' && tk.priority!=='high'
      && dayDiff(TODAY,tk.due)>=0 && dayDiff(TODAY,tk.due)<=3).sort((a,b)=>a.due-b.due)[0];
    if(soonTask){
      push({severity:'medium', people:[r.person.id], project:soonTask.project,
        text:`<b>${esc(r.person.name)}</b> has several urgent deadlines close together. Raise <b>${esc(soonTask.name)}</b> to High priority so it's not missed.`,
        applyText:`Set the priority of "${soonTask.name}" to High.`,
        action:{type:'reprioritize-task', taskId:soonTask.id, priority:'high'}});
    }
  });

  // 6) A not-started task whose start date collides with 3+ other tasks for the same person -> reschedule it out
  capRoster.forEach(r=>{
    const dayCounts = {};
    TASKS.filter(tk=>isAssignedTo(tk,r.person.id) && tk.status!=='done').forEach(tk=>{
      taskWorkingDays(tk).forEach(d=>{ const k=toISO(d); dayCounts[k]=(dayCounts[k]||0)+1; });
    });
    const crowded = TASKS.find(tk=>tk.assignee===r.person.id && tk.status==='not-started'
      && dayDiff(TODAY, tk.start)>0 && (dayCounts[toISO(tk.start)]||0)>=3);
    if(crowded){
      push({severity:'low', people:[r.person.id], project:crowded.project,
        text:`<b>${esc(crowded.name)}</b> is scheduled to start on a day <b>${esc(r.person.name)}</b> already has ${dayCounts[toISO(crowded.start)]} other tasks running. Push the start date out by 3 working days.`,
        applyText:`Move the start date of "${crowded.name}" out by 3 working days.`,
        action:{type:'reschedule-task', taskId:crowded.id, shiftWorkingDays:3}});
    }
  });

  // De-dupe roughly by text, sort by severity
  const seen = new Set();
  const sevRank = {high:0, medium:1, low:2};
  const unique = recs.filter(r=>{ if(seen.has(r.text)) return false; seen.add(r.text); return true; })
    .sort((a,b)=>sevRank[a.severity]-sevRank[b.severity]);

  if(scopePersonId){
    return unique.filter(r=> r.people.includes(scopePersonId));
  }
  return unique;
}

/* Executes a recommendation's action against live state. Called only after the
   user confirms in the Apply modal. Returns a short toast message. */
function applyRecommendationAction(action){
  if(action.type==='reassign-task'){
    const tk = TASKS.find(x=>x.id===action.taskId); if(!tk) return null;
    tk.assignee = action.toPersonId;
    return 'Task reassigned — projects, kanban, planning and capacity updated.';
  }
  if(action.type==='add-support'){
    const tk = TASKS.find(x=>x.id===action.taskId); if(!tk) return null;
    tk.assignee2 = action.toPersonId;
    return 'Support added to the task — updated across the portal.';
  }
  if(action.type==='escalate-blocker'){
    const b = BLOCKERS.find(x=>x.id===action.blockerId); if(!b) return null;
    b.urgency = 'high';
    return 'Blocker escalated to high urgency.';
  }
  if(action.type==='reprioritize-task'){
    const tk = TASKS.find(x=>x.id===action.taskId); if(!tk) return null;
    tk.priority = action.priority;
    return 'Priority updated — reflected everywhere this task appears.';
  }
  if(action.type==='reschedule-task'){
    const tk = TASKS.find(x=>x.id===action.taskId); if(!tk) return null;
    // shift the start date forward by N schedulable days (respecting the task's weekend preference)
    let cursor = new Date(tk.start), moved = 0;
    while(moved < action.shiftWorkingDays){
      cursor = addDays(cursor, 1);
      if(tk.includeWeekends || !isWeekend(cursor)) moved++;
    }
    tk.start = cursor;
    if(tk.due <= tk.start) tk.due = addDays(tk.start, action.shiftWorkingDays);
    return 'Task rescheduled — planning and the allocation matrix updated.';
  }
  return null;
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
const hasWindowStorage = typeof window!=='undefined' && !!window.storage;
function hasLocalStorage(){
  try{ const k='__diem_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const CAN_PERSIST_LOCAL = (typeof localStorage!=='undefined') && hasLocalStorage();

async function storageGet(key){
  if(hasWindowStorage){
    try{ const r = await window.storage.get(key, true); return r ? r.value : null; }
    catch(e){ return null; }
  }
  if(CAN_PERSIST_LOCAL){ return localStorage.getItem(key); }
  return null;
}
async function storageSet(key, value){
  if(hasWindowStorage){
    try{ const r = await window.storage.set(key, value, true); return !!r; }
    catch(e){ return false; }
  }
  if(CAN_PERSIST_LOCAL){ try{ localStorage.setItem(key, value); return true; }catch(e){ return false; } }
  return false;
}

function serializeAll(){
  return JSON.stringify({
    seedVersion: SEED_DATA_VERSION,
    people: PEOPLE,
    projects: PROJECTS.map(p=>({...p, start:toISO(p.start), end:toISO(p.end)})),
    tasks: TASKS.map(tk=>({...tk, due:toISO(tk.due), start:tk.start?toISO(tk.start):null})),
    blockers: BLOCKERS,
    requests: REQUESTS,
    agreedPoints: AGREED_POINTS,
    ceoActions: CEO_ACTIONS,
    documents: DOCUMENTS,
    dayOff: DAYOFF
  });
}
function hydrate(data){
  PEOPLE = (data.people||[]).map(p=>({...p}));
  PROJECTS = (data.projects||[]).map(p=>({...p, start:fromISO(p.start), end:fromISO(p.end), team:[...(p.team||[])]}));
  TASKS = (data.tasks||[]).map(tk=>{
    const due = fromISO(tk.due);
    const includeWeekends = !!tk.includeWeekends;
    const start = tk.start ? fromISO(tk.start) : workingDaysBefore(due, tk.workloadDays||1, includeWeekends);
    return {...tk, due, start, includeWeekends, workloadDays: tk.workloadDays!=null ? tk.workloadDays : (tk.effort||1)};
  });
  BLOCKERS = (data.blockers||[]).map(b=>({...b}));
  REQUESTS = (data.requests||[]).map(r=>({...r}));
  AGREED_POINTS = (data.agreedPoints||[]).map(a=>({...a}));
  CEO_ACTIONS = (data.ceoActions||[]).map(a=>({...a}));
  DOCUMENTS = (data.documents||[]).map(d=>({...d}));
  DAYOFF = (data.dayOff||[]).map(d=>({...d}));
}
function hydrateSeed(){
  hydrate({people:SEED_PEOPLE, projects:SEED_PROJECTS, tasks:SEED_TASKS.map(tk=>({...tk})), blockers:SEED_BLOCKERS, requests:SEED_REQUESTS.map(r=>({...r})), agreedPoints:SEED_AGREED_POINTS.map(a=>({...a})), ceoActions:[], documents:SEED_DOCUMENTS.map(d=>({...d})), dayOff:SEED_DAYOFF.map(d=>({...d}))});
}
// Guards against stale browser-saved data from an older version of this app missing a
// core team member (e.g. Tracy was added in a later revision). Runs after loading any
// previously-saved data and silently repairs the roster in place if someone's missing.
function ensureCoreTeamMembers(){
  let changed = false;
  SEED_PEOPLE.filter(sp=>sp.roleType==='ceo').forEach(sp=>{
    if(!PEOPLE.some(p=>p.id===sp.id)){ PEOPLE.push({...sp}); changed = true; }
  });
  return changed;
}

let saveTimer = null;
function setSaveStatus(state, text){
  const el = document.getElementById('saveStatus');
  const txt = document.getElementById('saveStatusText');
  if(!el) return;
  el.className = 'save-status '+state;
  txt.textContent = text || (state==='saved' ? 'All changes saved' : state==='saving' ? 'Saving…' : 'Not saved');
}
function persist(){
  setSaveStatus('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await storageSet(STORAGE_KEY, serializeAll());
    if(ok) setSaveStatus('saved');
    else setSaveStatus('error', hasWindowStorage||CAN_PERSIST_LOCAL ? 'Could not save' : "Changes won't be saved in this browser");
  }, 260);
}

function openMetricInfoModal(metric, ctx){

    if(isManual){

          <div class="manual-callout-row"><span>Changed by</span><b>${esc(personById(p.progressManual.by)?.name||'—')}</b></div>

          <button class="btn btn-ghost btn-sm" id="miRestoreAutoBtn" style="margin-top:8px;">Restore automatic value</button>
        </div>`;
    }
  } else if(metric==='capacity' || metric==='availability' || metric==='overload'){
    const person = personById(ctx);
    if(!person) return;
    const cap = computeCapacity(person.id);
    title = metric==='availability' ? 'Remaining availability' : (metric==='overload' ? 'Overload' : 'Capacity used');
    value = metric==='availability' ? Math.max(0,100-cap.pct)+'%' : cap.pct+'%';
    meaning = metric==='availability'
      ? 'The share of this person\'s working capacity that is not yet allocated to active or upcoming work.'
      : 'How much of this person\'s available working capacity is currently allocated, based on their real task load — not a typed-in number.';
    formula = metric==='availability'
      ? '100% − Capacity used'
      : 'Σ (working days scheduled in the next 2 weeks × role share × status weight) ÷ capacity baseline (working days) × 100<br><span style="color:var(--ink-faint)">Role share: 100% if sole assignee, 50% if co-assigned · Status weight: Blocked ×0.6, otherwise ×1.0 · Not-yet-started work further than 2 weeks out counts lightly as look-ahead pressure</span>';
    period = 'Current 2-week planning window, based on each task\'s estimated workload in days';
    included = `${cap.activeTaskCount} active task${cap.activeTaskCount===1?'':'s'} across ${cap.projectCount} project${cap.projectCount===1?'':'s'}`;
    excluded = 'Completed tasks; tasks assigned to other people';
    source = 'Tasks assigned to '+person.name.split(' ')[0];
    lastUpdated = 'Live — recalculates whenever a task changes';
    calcType = 'Automatically calculated — capacity has no manual override';
    if(metric==='overload'){
      meaning = 'An employee is only considered overloaded once their allocated capacity exceeds 100% for the current period. Being at or below 100% is not overload.';
      formula = 'Overload = Capacity used − 100% (only shown when positive)';
      value = cap.pct>100 ? `Overloaded by ${cap.pct-100}%` : 'Not overloaded';
    }
  } else if(metric==='needs-support'){
    const person = personById(ctx);
    if(!person) return;
    const cap = computeCapacity(person.id);
    title = 'Needs Support';
    value = cap.needsAttention ? 'Flagged' : 'Not flagged';
    meaning = 'This label only appears when justified by real conditions — never applied by default.';
    formula = 'Flagged if: capacity is above 100%, OR there is a blocked task, OR there are 2+ high-priority tasks due within 3 days.';
    period = 'Current state';
    included = cap.reasons.length ? cap.reasons.map(r=>r.label).join(' · ') : 'No qualifying conditions currently';
    source = 'Task and capacity data for '+person.name.split(' ')[0];
    lastUpdated = 'Live';
  }

  openModal({
    title, sub: value, hideFooter:true,
    bodyHTML:`
      <div class="metric-panel">
        ${infoRowHTML('Meaning', esc(meaning))}
        ${formula?`<div class="info-row"><span class="info-row-lbl">Formula</span><span class="info-row-val mono" style="font-size:11.5px; line-height:1.7;">${formula}</span></div>`:''}
        ${infoRowHTML('Reporting period', esc(period))}
        ${infoRowHTML('Included data', esc(included))}
        ${infoRowHTML('Excluded data', esc(excluded))}
        ${infoRowHTML('Data source', esc(source))}
        ${infoRowHTML('Last updated', esc(lastUpdated))}
        ${infoRowHTML('Calculation type', esc(calcType))}
      </div>
      ${manualBlock}
    `
  });
  const restoreBtn = document.getElementById('miRestoreAutoBtn');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    const p = projectById(ctx);
    if(p && p.progressManual){ p.progressManualLog = p.progressManualLog||[]; p.progressManualLog.push({...p.progressManual, restoredAt:toISO(TODAY), restoredBy:currentProfileId}); p.progressManual = {enabled:false, value:computeAutoProgress(p), reason:'', by:null, date:null}; }
    persist(); closeModal(); toast('Restored to the automatically calculated value'); navigateTo(currentSection);
  };
}

function dueLabel(date){
  const d = dayDiff(TODAY, date);
  if(d<0) return {text:`${fmt(date)} · ${-d}d overdue`, overdue:true};
  if(d===0) return {text:`${fmt(date)} · today`, overdue:false};
  if(d===1) return {text:`${fmt(date)} · tomorrow`, overdue:false};
  return {text:`${fmt(date)} · ${d}d`, overdue:false};
}

const dropdownEl = () => document.getElementById('dropdownMenu');

function openDropdown(anchorEl, items){
  // items: [{label, icon, onClick, danger, subtle, sep}]
  const html = items.map(it=>{
    if(it.sep) return '<div class="dropdown-sep"></div>';
    return `<button class="dropdown-item${it.danger?' danger':''}${it.subtle?' subtle':''}" data-idx="${items.indexOf(it)}">${it.icon||''}<span>${esc(it.label)}</span></button>`;
  }).join('');
  dropdownEl().innerHTML = html;
  const rect = anchorEl.getBoundingClientRect();
  dropdownEl().style.top = (rect.bottom+6)+'px';
  let left = rect.right-208;
  if(left<8) left = rect.left;
  dropdownEl().style.left = Math.max(8,left)+'px';
  dropdownEl().classList.add('open');
  dropdownEl().querySelectorAll('.dropdown-item').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const idx = +btn.dataset.idx; closeDropdown(); items[idx].onClick(); };
  });
}

function portfolioStats(){
  const stageCounts = {'not-started':0,'in-progress':0,'done':0};
  const healthCounts = {'on-track':0,'at-risk':0,'blocked':0};
  const typeCounts = {client:0, internal:0};
  PROJECTS.forEach(p=>{
    stageCounts[computeStage(p)]++;
    healthCounts[computeHealth(p)]++;
    typeCounts[p.type]++;
  });
  const last7 = TASKS.filter(tk=> tk.status==='done' && dayDiff(tk.due,TODAY)>=0 && dayDiff(tk.due,TODAY)<=7).length;
  const inProgress = TASKS.filter(tk=>tk.status==='in-progress').length;
  const blockedTasks = TASKS.filter(tk=>tk.status==='blocked').length;
  const upcoming14 = TASKS.filter(tk=> tk.status!=='done' && dayDiff(TODAY,tk.due)>=0 && dayDiff(TODAY,tk.due)<=14).length;
  return {stageCounts, healthCounts, typeCounts, activeProjects:PROJECTS.length, tasksDoneThisWeek:last7, tasksInProgress:inProgress, blockedTasks, upcoming14};
}

function ceoAttentionItems(){

    }
  });
  capacityRoster().forEach(p=>{

    if(cap.status==='overloaded'){
      items.push({severity:'high', kind:'person', person:p.id, label:p.name,
        sub: cap.reasons.map(r=>r.label).join(' · ') || `${cap.pct}% of capacity`});
    } else if(cap.status==='needs-support'){
      items.push({severity:'medium', kind:'person', person:p.id, label:p.name,
        sub: cap.reasons.map(r=>r.label).join(' · ') || `${cap.pct}% of capacity`});

  const sevRank = {high:0, medium:1, low:2};
  return items.sort((a,b)=>sevRank[a.severity]-sevRank[b.severity]);
}

/* ============================================================
   CEO NEEDS ATTENTION — compact, severity-ranked, real-data-only
   ============================================================ */
function projectElapsedPct(p){
  const totalDays = Math.max(1, dayDiff(fromISO(toISOMaybe(p.start)), fromISO(toISOMaybe(p.end))));
  const elapsedDays = clamp(dayDiff(fromISO(toISOMaybe(p.start)), TODAY), 0, totalDays);
  return round(elapsedDays/totalDays*100);
}
function buildNeedsAttention(){
  const items = [];
  const ceoId = PEOPLE.find(p=>p.roleType==='ceo')?.id || 'paul';
  PROJECTS.forEach(p=>{
    const health = computeHealth(p);
    const stage = computeStage(p);
    const pct = projectProgress(p);
    const blockedCt = blockedTaskCount(p.id);
    const overdueCt = tasksFor(p.id).filter(tk=>tk.status!=='done' && dayDiff(TODAY,tk.due)<0).length;
    const daysToEnd = dayDiff(TODAY, p.end);
    const owner = personById(p.owner);
    const impactLabel = p.type==='client' ? 'Client delivery at risk' : 'Internal delivery at risk';
    let why = null, impact = null, severity = null;

    if(health==='blocked'){
      severity = 'critical';
      why = `${blockedCt} blocked task${blockedCt===1?'':'s'}`;
      impact = impactLabel;
    } else if(health==='at-risk'){
      severity = 'warning';
      why = daysToEnd>=0 ? `${daysToEnd}d to deadline at ${pct}% complete` : `${-daysToEnd}d past due at ${pct}% complete`;
      impact = impactLabel;
    } else if(overdueCt>0){
      severity = 'warning';
      why = `${overdueCt} overdue task${overdueCt===1?'':'s'}`;
      impact = 'Deadline slipping';
    } else if(stage!=='done'){
      const gap = projectElapsedPct(p) - pct;
      if(gap>=30){
        severity = gap>=45 ? 'critical' : 'warning';
        why = `progress trailing timeline by ${gap}pt`;
        impact = 'Behind schedule';
      }
    }
    if(why){
      items.push({
        severity, kind:'project', ref:p.id, title:p.name, why, impact,
        action:`Review with ${owner?owner.name.split(' ')[0]:'the owner'}`
      });
    }
  });
  capacityRoster().forEach(person=>{
    const cap = computeCapacity(person.id);
    if(cap.status==='overloaded'){
      items.push({severity:'critical', kind:'person', ref:person.id, title:`${person.name} is overloaded`,
        why: `${cap.pct}% of capacity`, impact: cap.reasons[0]?.label || 'Risk of missed deadlines', action:'Reallocate a task'});
    }
  });
  computeNextSteps(null).filter(s=> s.approvalPerson===ceoId && (!s.task.approvalDecision || s.task.approvalDecision.status==='pending')).forEach(s=>{
    const proj = projectById(s.project);
    items.push({severity: s.overdue?'critical':'warning', kind:'approval', ref:s.id, title:s.action,
      why:'Waiting for your approval', impact: proj?proj.name:'', action:'Approve, reject or request info'});
  });
  AGREED_POINTS.filter(a=>a.status==='pending').forEach(a=>{
    const proj = a.project?projectById(a.project):null;
    items.push({severity:'warning', kind:'decision', ref:a.id,
      title: a.text.length>70?a.text.slice(0,70)+'…':a.text,
      why:'Pending confirmation', impact: proj?proj.name:'', action:'Confirm decision'});
  });
  REQUESTS.filter(r=>r.status==='open').forEach(r=>{
    const person = personById(r.person);
    const proj = r.project ? projectById(r.project) : null;
    const task = r.task ? TASKS.find(t=>t.id===r.task) : null;
    items.push({severity:'critical', kind:'request', ref:r.id,
      title:`${person?person.name:'A team member'} requested support — ${r.type||'General support'}`,
      why: [proj?proj.name:null, task?task.name:null].filter(Boolean).join(' · ') || r.message,
      impact: r.message, action:'Acknowledge'});
  });
  pendingDayOffRequests().forEach(d=>{
    const person = personById(d.person);
    const span = d.startDate===d.endDate ? fmt(fromISO(d.startDate)) : `${fmt(fromISO(d.startDate))} – ${fmt(fromISO(d.endDate))}`;
    items.push({severity:'warning', kind:'dayoff', ref:d.id,
      title:`${person?person.name:'A team member'} requested ${d.type||'day off'}`,
      why: span, impact:'Awaiting approval', action:'Review request'});
  });
  const thisWeekId = isoWeekInfo(TODAY).weekId;
  const resolvedKeys = new Set(CEO_ACTIONS.filter(a=>a.weekId===thisWeekId).map(a=>`${a.kind}:${a.ref}`));
  const remaining = items.filter(it=> !resolvedKeys.has(`${it.kind}:${it.ref}`));
  const sevRank = {critical:0, warning:1};
  return remaining.sort((a,b)=>sevRank[a.severity]-sevRank[b.severity]);
}
/* Logs a resolution: removes the item from Needs Attention for the rest of this
   week, and adds a line to this week's recap under "Actions taken." If the
   underlying issue is still unresolved next week, it will resurface on its own. */

  CEO_ACTIONS.push({

    kind, ref, title, note:note||'', by:currentProfileId
  });

function needsAttentionRowHTML(item){
  return `
    <div class="attn-row sev-${item.severity}" data-attn-kind="${item.kind}" data-attn-ref="${item.ref}" title="${esc([item.why,item.impact,item.action].filter(Boolean).join(' — '))}">
      <div class="attn-main">
        <div class="attn-name">${esc(item.title)}</div>
        <div class="attn-meta">${esc(item.why||item.impact||'')}</div>
      </div>
      <div class="attn-right">
        <button class="icon-btn attn-resolve-btn" data-resolve-kind="${item.kind}" data-resolve-ref="${esc(item.ref)}" title="Mark as resolved — adds this to this week's recap">✓</button>
        <span class="attn-arrow">→</span>
      </div>
    </div>
  `;
}
function wireNeedsAttention(root){
  root.querySelectorAll('[data-attn-kind]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.attn-resolve-btn')) return;
      const kind = row.dataset.attnKind, ref = row.dataset.attnRef;
      if(kind==='project') openProjectDetail(ref);
      else if(kind==='decision') openAgreedPointDetail(ref);
      else if(kind==='approval') openApprovalChooserModal(ref);
      else if(kind==='request') navigateTo('capacity');
      else if(kind==='dayoff') navigateTo('dayoff');
      else navigateTo('capacity');
    });
  });
  root.querySelectorAll('.attn-resolve-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const kind = btn.dataset.resolveKind, ref = btn.dataset.resolveRef;
      if(kind==='dayoff'){ navigateTo('dayoff'); return; }
      const item = buildNeedsAttention().find(a=> a.kind===kind && String(a.ref)===String(ref));
      if(item) openResolveModal(item);
    });
  });
}
/* Resolving an attention item does two things: it takes the real action where
   one exists (clears the underlying blocker / request so the data itself
   improves), and it always logs a short note that shows up in this week's
   recap under "Actions taken." If the root cause isn't actually fixed, the
   item will reappear on its own next week. */
function openResolveModal(item){
  if(item.kind==='approval'){ openApprovalChooserModal(item.ref); return; }
  if(item.kind==='decision'){
    const ap = AGREED_POINTS.find(a=>a.id===item.ref);
    openModal({
      title:'Confirm this decision', sub: ap?ap.text:item.title, saveLabel:'Confirm',
      bodyHTML:`
        <div class="field"><label>Status</label>
          <select id="resDecisionStatus">
            <option value="agreed">Agreed</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="field"><label>Note for this week's recap (optional)</label><textarea id="resNote" placeholder="What was decided or done?"></textarea></div>
      `,
      onSave:()=>{
        if(ap) ap.status = document.getElementById('resDecisionStatus').value;
        const note = document.getElementById('resNote').value.trim();
        logCeoAction('decision', item.ref, item.title, note);
        persist(); closeModal(); toast("Marked as resolved — added to this week's recap"); navigateTo(currentSection);
      }
    });
    return;
  }
  openModal({
    title:'Mark as resolved', sub:item.title, saveLabel:'Mark resolved',
    bodyHTML:`<div class="field"><label>What was done? (shown in this week's recap)</label><textarea id="resNote" placeholder="e.g. Followed up directly — resolved.">${esc(item.action||'')}</textarea></div>`,
    onSave:()=>{
      const note = document.getElementById('resNote').value.trim() || item.action || 'Resolved';
      if(item.kind==='project'){
        const b = openBlockersFor(item.ref)[0];
        if(b) b.status = 'resolved';
      } else if(item.kind==='request'){
        const r = REQUESTS.find(x=>x.id===item.ref);
        if(r) r.status = 'resolved';
      }
      logCeoAction(item.kind, item.ref, item.title, note);
      persist(); closeModal(); toast("Marked as resolved — added to this week's recap"); navigateTo(currentSection);
    }
  });
}

/* ============================================================
   CEO CHARTS — donut (conic-gradient), trend chip, progress bars
   ============================================================ */
function donutChartHTML(segments, centerLabel){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let cum = 0;
  const stops = segments.map(s=>{
    const from = (cum/total)*100; cum += s.value; const to = (cum/total)*100;
    return `${s.color} ${from}% ${to}%`;
  });
  return `<div class="donut" data-donut-total title="${total} ${esc(centerLabel||'total')}" style="background:conic-gradient(${stops.join(',')});">
    <div class="donut-hole"><span class="donut-num mono">${total}</span><span class="donut-lbl">${esc(centerLabel||'total')}</span></div>
  </div>`;
}
function donutLegendHTML(segments, filterKey){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  return `<div class="donut-legend">${segments.map(s=>`
    <div class="li" ${filterKey?`data-donut-filter="${filterKey}" data-donut-value="${s.key}"`:''} title="${esc(s.label)}: ${s.value} (${Math.round((s.value/total)*100)}%)">
      <span class="li-label"><span class="sw" style="background:${s.color}"></span>${esc(s.label)}</span>
      <span class="li-nums"><span class="li-count mono">${s.value}</span><span class="li-pct">${Math.round((s.value/total)*100)}%</span></span>
    </div>`).join('')}</div>`;
}
function wireDonutFilters(root){
  root.querySelectorAll('[data-donut-filter]').forEach(li=>{
    li.addEventListener('click', ()=>{
      const key = li.dataset.donutFilter, val = li.dataset.donutValue;
      if(key==='type') ptTypeFilter = val;
      else if(key==='stage'){ /* stage isn't a direct filter; jump to overview and let health/type stand */ }
      navigateTo('projects');
    });
  });
  root.querySelectorAll('[data-donut-total]').forEach(d=>{
    d.addEventListener('click', ()=>{ ptTypeFilter='all'; ptHealthFilter='all'; ptPersonFilter='all'; navigateTo('projects'); });
  });
}
function weeklyTrendChipHTML(){
  const changes = getRecapChanges(null).filter(c=>c.kind==='project' && (c.sentiment==='good'||c.sentiment==='bad'));
  const good = changes.filter(c=>c.sentiment==='good').length;
  const bad = changes.filter(c=>c.sentiment==='bad').length;
  if(!good && !bad) return `<span class="trend-chip"><span class="tc-arrow">→</span>No change this week</span>`;
  if(good>=bad) return `<span class="trend-chip up"><span class="tc-arrow">↑</span>${good} improved${bad?`, ${bad} declined`:''}</span>`;
  return `<span class="trend-chip down"><span class="tc-arrow">↓</span>${bad} declined${good?`, ${good} improved`:''}</span>`;
}

function employeeProjectSummary(personId, project){
  const myTasksInProj = tasksFor(project.id).filter(tk=>isAssignedTo(tk,personId));
  const completed = myTasksInProj.filter(tk=>tk.status==='done');
  const active = myTasksInProj.filter(tk=>tk.status!=='done');
  const current = active.find(tk=>tk.status==='in-progress') || [...active].sort((a,b)=>a.due-b.due)[0] || null;
  const blocked = active.filter(tk=>tk.status==='blocked');
  const upcoming = active.length ? [...active].sort((a,b)=>a.due-b.due)[0] : null;
  const remainingDays = active.reduce((s,tk)=> s + (tk.remainingDays!=null?tk.remainingDays:(tk.workloadDays||0)), 0);
  const myRequest = REQUESTS.find(r=>r.person===personId && r.project===project.id && r.status!=='resolved');
  const role = project.owner===personId ? 'Owner' : 'Contributor';
  return {project, myTasksInProj, completed, active, current, blocked, upcoming, remainingDays, myRequest, role};
}

function projectAttentionNote(p){
  const health = computeHealth(p);
  if(health==='blocked') return null; // already covered by the blocker flag
  const pct = projectProgress(p);
  const daysToEnd = dayDiff(TODAY, fromISO(toISOMaybe(p.end)));
  if(health==='at-risk'){
    return daysToEnd>=0 ? `${daysToEnd}d to deadline at ${pct}% complete` : `${-daysToEnd}d past due`;
  }
  if(computeStage(p)!=='done'){
    const gap = projectElapsedPct(p) - pct;
    if(gap>=30) return `Progress trailing timeline by ${gap}pt`;
  }
  return null;
}
function projectCapacityWarning(p){
  const overloaded = p.team.map(id=>personById(id)).filter(Boolean).filter(person=>computeCapacity(person.id).status==='overloaded');
  return overloaded.length ? `${overloaded.length} team member${overloaded.length===1?'':'s'} overloaded` : null;
}
function projectCardHTML(p){
  const stage = computeStage(p);
  const health = computeHealth(p);
  const pct = projectProgress(p);
  const blockedCt = blockedTaskCount(p.id);
  const activeCt = activeTaskCount(p.id);
  const completedCt = tasksFor(p.id).filter(tk=>tk.status==='done').length;
  const milestone = nextActionFor(p);
  const keyBlocker = openBlockersFor(p.id)[0];
  const attentionNote = projectAttentionNote(p);
  const capWarning = projectCapacityWarning(p);
  const pastTarget = isProjectPastTargetDate(p);
  let flagText = keyBlocker ? keyBlocker.title : (attentionNote || capWarning);
  if(flagText && flagText.length>64) flagText = flagText.slice(0,64)+'…';
  return `
    <div class="project-card" data-project="${p.id}">
      <div class="pc-top">
        <div class="tags">${typeTagHTML(p)}${p.priority?priorityTagHTML(p.priority):''}</div>
        <button class="dots-btn" data-project-menu="${p.id}" title="More options">⋮</button>
      </div>
      <div class="pc-title">${esc(p.name)}</div>
      <div class="pc-sub">${esc(personById(p.owner)?.name||'')} · Owner</div>
      <div class="pc-row2">${stagePillHTML(stage)}${healthFlagHTML(health)}</div>
      <div class="pc-people">${peopleChipsHTML(p.team)}</div>

      <div class="runway">
        <div class="runway-labels"><span>Progress${pctInfoBtn('project-progress',p.id)}</span><span class="pct">${pct}%${p.progressManual&&p.progressManual.enabled?' <span class="adjusted-tag" style="margin-left:4px;">Adjusted</span>':''}</span></div>
        <div class="runway-track"><div class="runway-fill ${stage}" style="width:${pct}%"></div></div>
      </div>
      <div class="pc-stat-row">
        <span class="pc-stat">${activeCt} active</span>
        <span class="pc-stat">${completedCt} done</span>
        ${p.nextDeliverable ? `<span class="pc-stat" title="Next deliverable">🎯 ${esc(p.nextDeliverable.length>34?p.nextDeliverable.slice(0,34)+'…':p.nextDeliverable)}</span>`

function reasonForPriorityTask(tk){
  if(tk.status==='blocked') return 'Blocked';
  const d = dayDiff(TODAY, tk.due);
  if(d<0) return 'Overdue';
  if(d===0) return 'Due today';
  if(d===1) return 'Due tomorrow';
  if(tk.priority==='high') return 'High priority';
  const proj = projectById(tk.project);
  if(proj && proj.type==='client') return 'Client project';
  return 'Upcoming';
}

/* ---- Allocation matrix: employees (rows) x projects (columns) ---- */
function clientInternalSplit(personId){
  const tasks = activeTasksForPerson(personId);
  if(!tasks.length) return null;
  let client=0, internal=0;
  tasks.forEach(tk=>{ const p = projectById(tk.project); if(!p) return; if(p.type==='client') client++; else internal++; });
  const total = client+internal;
  if(!total) return null;
  return {clientPct: round(client/total*100), internalPct: round(internal/total*100)};
}

let dragTaskId = null;
function wireKanban(body){
  body.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('click', ()=> openTaskModal(card.dataset.task));
    card.addEventListener('dragstart', ()=>{ dragTaskId = card.dataset.task; card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
  });
  body.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', (e)=>{
      e.preventDefault(); col.classList.remove('dragover');
      const newStatus = col.dataset.col;
      const tk = TASKS.find(x=>x.id===dragTaskId);
      if(!tk) return;
      if(newStatus==='blocked' && !tk.blockerReason){
        openTaskModal(tk.id, {forceStatus:'blocked'});
        return;
      }
      tk.status = newStatus;
      persist(); toast(`Moved to ${KANBAN_COLS.find(c=>c.status===newStatus).label}`);
      renderPTBody();
    });
  });
  wireKanbanScrollFade(body);
}
function wireKanbanScrollFade(body){
  const scroller = body.querySelector('#kanbanScroll');
  const fade = body.querySelector('#kanbanFade');
  if(!scroller || !fade) return;
  const update = ()=>{
    const hasMore = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft > 4;
    fade.classList.toggle('show', hasMore);
  };
  scroller.addEventListener('scroll', update, {passive:true});
  if(window.ResizeObserver){
    const ro = new ResizeObserver(update);
    ro.observe(scroller);
  }
  update();
}

              <div class="pr-proj">${esc(personById(tk.assignee)?.name||'')}${tk.assignee2?' + '+esc(personById(tk.assignee2)?.name||''):''} · Due <span${d.overdue?' style="color:var(--health-blocked); font-weight:700;"':''}>${fmt(tk.due)}${d.overdue?' (overdue)':''}</span> · ${tk.workloadDays}d workload · Weight ${tk.weight}%</div>
            </div>
            <div style="display:flex; gap:7px; align-items:center;">${priorityTagHTML(tk.priority)}${taskStatusPillHTML(tk.status)}</div>
          </div>
        `;
        }).join('') : '<div class="empty-state">No tasks yet.</div>'}
      </div>

      <div class="section-title">Blockers & risks</div>
      ${blockers.length ? blockers.map(b=>`
        <div class="blocker-card urgency-${b.urgency} status-${b.status}" style="padding:14px 16px; margin-bottom:10px;">
          <div class="blocker-head"><div class="blocker-title" style="font-size:13.5px;">${esc(b.title)}</div><span class="tag priority-${b.urgency==='high'?'high':b.urgency==='medium'?'medium':'low'}">${URGENCY_LABEL[b.urgency]}</span></div>
          <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.55;">${esc(b.impact)}</div>
        </div>
      `).join('') : '<div class="empty-state">No blockers logged for this project.</div>'}

      <div class="section-title" style="margin-top:18px;">Decisions &amp; agreed points</div>
      ${(()=>{
        const manual = AGREED_POINTS.filter(a=>a.project===p.id);
        const rolled = rolledOverAgreedPoints(null).filter(it=>it.project===p.id);
        const combined = rolled.map(rolledPointRowHTML).join('') + manual.map(agreedPointRowHTML).join('');
        return combined || '<div class="empty-state">No decisions logged for this project yet.</div>';
      })()}

      <div style="display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; align-items:center;">
        <button class="btn btn-ghost btn-sm" id="pdEditBtn">Edit project</button>
        <button class="btn btn-ghost btn-sm" id="pdBlockerBtn">Add blocker</button>
        <button class="btn btn-ghost btn-sm" id="pdTaskBtn">Add task</button>
        <button class="btn btn-ghost btn-sm" id="pdAgreedBtn">Add agreed point</button>
        <button class="dots-btn" id="pdMoreBtn" title="More options" style="margin-left:auto;">⋮</button>
      </div>
    `
  });
  document.getElementById('pdEditBtn').onclick = ()=> openProjectModal(p.id);
  document.getElementById('pdBlockerBtn').onclick = ()=> openBlockerModal(null, p.id);
  document.getElementById('pdTaskBtn').onclick = ()=> openTaskModal(null, {presetProject:p.id});
  document.getElementById('pdAgreedBtn').onclick = ()=> openAgreedPointModal(null, p.id);
  document.getElementById('pdMoreBtn').onclick = (e)=> openDropdown(e.currentTarget, [
    {label:'Adjust progress manually', onClick:()=>openManualProgressModal(p.id)},
    {label:'Archive project', danger:true, onClick:()=>confirmArchiveProject(p.id)}
  ]);
  document.querySelectorAll('[data-detail-task]').forEach(row=>{
    row.addEventListener('click', ()=> openTaskModal(row.dataset.detailTask));
  });
  document.querySelectorAll('.agreed-row[data-agreed]').forEach(row=>{
    row.addEventListener('click', ()=> openAgreedPointDetail(row.dataset.agreed));
  });
  document.querySelectorAll('.agreed-row[data-rolled]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const t = TASKS.find(x=>x.id===row.dataset.rolled);
      if(t) openTaskModal(t.id); else toast('That source task was removed or cancelled.');
    });
  });
  if(highlightTaskId){
    const hl = document.querySelector('.task-highlight');
    if(hl) hl.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

/* ============================================================
   MANUAL PROGRESS OVERRIDE (hidden behind three-dot menu)
   ============================================================ */
function openManualProgressModal(projectId){
  const p = projectById(projectId);
  const auto = computeAutoProgress(p);
  const current = projectProgress(p);
  const isActive = p.progressManual && p.progressManual.enabled;
  const history = p.progressManualLog||[];
  openModal({
    title:'Adjust progress manually', sub: p.name, saveLabel:'Save override',
    bodyHTML:`
      <div class="progress-compare">
        <div class="pc-item"><div class="pc-num">${auto}%</div><div class="pc-lbl">Auto-calculated</div></div>
        <div class="pc-arrow">→</div>
        <div class="pc-item"><div class="pc-num" id="pcManualPreview">${current}%</div><div class="pc-lbl">Manual override</div></div>
      </div>
      ${isActive ? `<div class="manual-callout" style="margin-bottom:14px;">
        <div class="manual-callout-row"><span>Currently changed by</span><b>${esc(personById(p.progressManual.by)?.name||'—')}</b></div>
        <div class="manual-callout-row"><span>Changed on</span><b>${p.progressManual.date?fmt(fromISO(p.progressManual.date)):'—'}</b></div>
      </div>` : ''}
      <div class="field-inline-check" style="margin-bottom:14px;">
        <input type="checkbox" id="manualEnabled" ${isActive?'checked':''}>
        <label for="manualEnabled" style="text-transform:none; font-size:13px; margin:0;">Override the auto-calculated progress</label>
      </div>
      <div class="field">
        <label>Manual progress (%)</label>
        <input type="number" id="manualValue" min="0" max="100" value="${p.progressManual?p.progressManual.value:auto}">
      </div>
      <div class="field">
        <label>Reason for override</label>
        <textarea id="manualReason" placeholder="e.g. Client confirmed phase 2 is effectively complete pending paperwork">${esc(p.progressManual?p.progressManual.reason||'':'')}</textarea>
      </div>
      <div class="field-hint">Unchecking the box restores the automatically calculated value. The original auto value is always preserved and never silently overwritten.</div>
      ${history.length ? `
        <div class="section-title" style="margin-top:18px;">Audit history</div>
        <div class="audit-log">
          ${history.slice().reverse().map(h=>`<div class="audit-row"><span>${h.value}% by ${esc(personById(h.by)?.name.split(' ')[0]||'—')}</span><span class="mono">${h.date?fmt(fromISO(h.date)):''}</span></div>`).join('')}
        </div>` : ''}
    `,
    onSave:()=>{
      const enabled = document.getElementById('manualEnabled').checked;
      const val = clamp(+document.getElementById('manualValue').value||0,0,100);
      const reason = document.getElementById('manualReason').value.trim();
      if(enabled && !reason){ modalFormError('Add a short reason for the override.'); return; }
      p.progressManualLog = p.progressManualLog || [];
      if(enabled) p.progressManualLog.push({value:val, reason, by:currentProfileId, date:toISO(TODAY)});
      p.progressManual = enabled ? {enabled:true, value:val, reason, by:currentProfileId, date:toISO(TODAY)} : {enabled:false, value:val, reason:'', by:null, date:null};
      persist(); closeModal(); toast(enabled?'Progress override saved':'Restored to automatic calculation'); navigateTo(currentSection);
    }
  });
  document.getElementById('manualValue').addEventListener('input', (e)=>{
    document.getElementById('pcManualPreview').textContent = clamp(+e.target.value||0,0,100)+'%';
  });
}

/* ============================================================
   PROJECT MODAL (create / edit)
   ============================================================ */
function openProjectModal(existingId){
  const existing = existingId ? projectById(existingId) : null;
  const teamSel = existing ? existing.team : [];
  openModal({
    title: existing ? 'Edit project' : 'New project', sub: existing?existing.name:'',
    wide:true, saveLabel: existing ? 'Save changes' : 'Create project',
    extraFootHTML: existing ? `<button class="btn btn-danger btn-sm" id="pmDeleteBtn" type="button">Delete</button>` : '',
    bodyHTML:`
      <div class="field"><label>Project name</label><input type="text" id="pmName" value="${esc(existing?existing.name:'')}" placeholder="e.g. Acme Corp — Growth Strategy"></div>
      <div class="field-row">
        <div class="field">
          <label>Type</label>
          <select id="pmType">
            <option value="client" ${(!existing||existing.type==='client')?'selected':''}>Client</option>
            <option value="internal" ${existing&&existing.type==='internal'?'selected':''}>Internal</option>
          </select>
        </div>
        <div class="field" id="pmClientWrap"><label id="pmClientLbl">Client name</label><input type="text" id="pmClientOrCategory" value="${esc(existing?(existing.client||existing.category||''):'')}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Start date</label><input type="date" id="pmStart" value="${existing?toISO(existing.start):toISO(TODAY)}"></div>
        <div class="field"><label>Due date</label><input type="date" id="pmEnd" value="${existing?toISO(existing.end):toISO(addDays(TODAY,60))}"></div>
      </div>
      <div class="field">
        <label>Owner</label>
        <select id="pmOwner">${PEOPLE.filter(p=>p.roleType!=='ceo').map(p=>`<option value="${p.id}" ${existing&&existing.owner===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Supporting team members</label>
        <div class="chip-select-row" id="pmTeamChips">
          ${PEOPLE.filter(p=>p.roleType!=='ceo').map(p=>`<button type="button" class="chip-select${teamSel.includes(p.id)?' checked':''}" data-person="${p.id}">${esc(p.name.split(' ')[0])}</button>`).join('')}
        </div>
        <div class="field-hint">The owner is added automatically. Health and stage are calculated automatically from tasks.</div>
      </div>
    `,
    onSave:()=>{
      const name = document.getElementById('pmName').value.trim();
      if(!name){ modalFormError('Give the project a name.'); return; }
      const type = document.getElementById('pmType').value;
      const clientOrCat = document.getElementById('pmClientOrCategory').value.trim();
      const start = fromISO(document.getElementById('pmStart').value);
      const end = fromISO(document.getElementById('pmEnd').value);
      const owner = document.getElementById('pmOwner').value;
      const team = Array.from(document.querySelectorAll('#pmTeamChips .chip-select.checked')).map(b=>b.dataset.person);
      if(!team.includes(owner)) team.push(owner);
      if(existing){
        Object.assign(existing, {name, type, client: type==='client'?clientOrCat:null, category: type==='internal'?clientOrCat:null, start, end, owner, team});
      } else {
        PROJECTS.push({id:newId('p'), name, type, client: type==='client'?clientOrCat:null, category: type==='internal'?clientOrCat:null, start, end, owner, team, progressManual:{enabled:false,value:0,reason:'',by:null,date:null}});
      }
      persist(); closeModal(); toast(existing?'Project updated':'Project created'); navigateTo(currentSection);
    }
  });
  function syncClientLabel(){
    const isClient = document.getElementById('pmType').value==='client';
    document.getElementById('pmClientLbl').textContent = isClient ? 'Client name' : 'Internal category';
    document.getElementById('pmClientOrCategory').placeholder = isClient ? 'e.g. Acme Corp' : 'e.g. Operations';
  }
  document.getElementById('pmType').addEventListener('change', syncClientLabel);
  syncClientLabel();
  document.querySelectorAll('#pmTeamChips .chip-select').forEach(chip=>{
    chip.addEventListener('click', ()=>{ chip.classList.toggle('checked'); markDirty(); });
  });
  if(existing){
    document.getElementById('pmDeleteBtn').addEventListener('click', ()=>{
      PROJECTS = PROJECTS.filter(x=>x.id!==existing.id);
      TASKS = TASKS.filter(x=>x.project!==existing.id);
      BLOCKERS = BLOCKERS.filter(x=>x.project!==existing.id);
      persist(); closeModal(); toast('Project deleted'); navigateTo(currentSection);
    });
  }
}

/* ============================================================
   TASK MODAL (create / edit)
   ============================================================ */
function openTaskModal(existingId, opts){
  opts = opts || {};
  const existing = existingId ? TASKS.find(t=>t.id===existingId) : null;
  const presetProject = opts.presetProject || (existing?existing.project:PROJECTS[0]?.id);
  const presetPerson = opts.presetPerson || (existing?existing.assignee:null);
  const forceStatus = opts.forceStatus;
  openModal({
    title: existing ? 'Edit task' : 'New task', sub: existing ? projectById(existing.project)?.name : '',
    saveLabel: existing ? 'Save changes' : 'Create task',
    extraFootHTML: existing ? `<button class="btn btn-danger btn-sm" id="tmDeleteBtn" type="button">Delete</button>` : '',
    bodyHTML:`
      <div class="field"><label>Task name</label><input type="text" id="tmName" value="${esc(existing?existing.name:'')}" placeholder="e.g. Draft client proposal"></div>
      <div class="field"><label>Project</label>
        <select id="tmProject">${PROJECTS.map(p=>`<option value="${p.id}" ${presetProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Assignee</label><select id="tmAssignee">${calendarRoster().map(p=>`<option value="${p.id}" ${presetPerson?presetPerson===p.id?'selected':'':(existing&&existing.assignee===p.id?'selected':'')}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Second assignee (optional)</label><select id="tmAssignee2"><option value="">— None —</option>${calendarRoster().map(p=>`<option value="${p.id}" ${existing&&existing.assignee2===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="tmStatus">${Object.keys(TASK_STATUS_LABEL).map(s=>`<option value="${s}" ${(forceStatus||(existing&&existing.status))===s?'selected':''}>${TASK_STATUS_LABEL[s]}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Priority</label>
          <select id="tmPriority">${Object.keys(PRIORITY_LABEL).map(s=>`<option value="${s}" ${(existing?existing.priority:'medium')===s?'selected':''}>${PRIORITY_LABEL[s]}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Due date</label><input type="date" id="tmDue" value="${existing?toISO(existing.due):toISO(addDays(TODAY,7))}"></div>
        <div class="field"><label>Weight (% of project)</label><input type="number" id="tmWeight" min="0" max="100" value="${existing?existing.weight:10}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Start date</label><input type="date" id="tmStart" value="${existing&&existing.start?toISO(existing.start):toISO(TODAY)}"></div>
        <div class="field"><label>Estimated workload (working days)</label><input type="number" id="tmWorkload" min="0.5" step="0.5" value="${existing?existing.workloadDays:1}" placeholder="e.g. 0.5, 1, 3, 7, 12"></div>
      </div>
      <div class="field-hint" style="margin:-9px 0 15px;">Enter the realistic number of working days this task needs — not limited to a 1–5 scale. It will span that many working days on the planning calendar, starting from the start date above.</div>
      <div class="field">
        <label>Include weekends in this task?</label>
        <div class="subtabs" id="tmWeekendsToggle" style="width:100%;">
          <button type="button" class="subtab-btn${(existing?!existing.includeWeekends:true)?' active':''}" data-val="no" style="flex:1;">No — skip Sat &amp; Sun</button>
          <button type="button" class="subtab-btn${(existing&&existing.includeWeekends)?' active':''}" data-val="yes" style="flex:1;">Yes — may use Sat &amp; Sun</button>
        </div>
        <input type="hidden" id="tmIncludeWeekends" value="${existing&&existing.includeWeekends?'yes':'no'}">
        <div class="field-hint" style="margin-top:6px;">If "No", the task automatically skips weekends and continues on the next working day — reflected in planning, the allocation matrix, the calendar and workload calculations.</div>
      </div>
      <div class="field" id="tmBlockerWrap" style="display:${(forceStatus==='blocked'||(existing&&existing.status==='blocked'))?'block':'none'}">
        <label>Blocker reason</label>
        <textarea id="tmBlockerReason" placeholder="What's blocking this task?">${esc(existing?existing.blockerReason||'':'')}</textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>Waiting for approval from (optional)</label>
          <select id="tmApproval"><option value="">— No approval needed —</option>${PEOPLE.map(p=>`<option value="${p.id}" ${existing&&existing.approvalPerson===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Dependency (optional)</label><input type="text" id="tmDependency" value="${esc(existing?existing.dependency||'':'')}" placeholder="e.g. Waiting on client data"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="tmNotes" placeholder="Any context worth logging">${esc(existing?existing.notes||'':'')}</textarea></div>
    `,
    onSave:()=>{
      const name = document.getElementById('tmName').value.trim();
      if(!name){ modalFormError('Give the task a name.'); return; }
      const status = document.getElementById('tmStatus').value;
      const blockerReason = document.getElementById('tmBlockerReason').value.trim();
      if(status==='blocked' && !blockerReason){ modalFormError('Add a blocker reason, or choose a different status.'); return; }
      const assignee = document.getElementById('tmAssignee').value;
      const assignee2v = document.getElementById('tmAssignee2').value;
      const data = {
        name, project: document.getElementById('tmProject').value,
        assignee, assignee2: assignee2v||null, status,
        priority: document.getElementById('tmPriority').value,
        due: fromISO(document.getElementById('tmDue').value),
        weight: clamp(+document.getElementById('tmWeight').value||0,0,100),
        start: fromISO(document.getElementById('tmStart').value),
        workloadDays: Math.max(0.5, +document.getElementById('tmWorkload').value||1),
        includeWeekends: document.getElementById('tmIncludeWeekends').value==='yes',
        blockerReason: status==='blocked'?blockerReason:'',
        approvalPerson: document.getElementById('tmApproval').value || null,
        dependency: document.getElementById('tmDependency').value.trim(),
        notes: document.getElementById('tmNotes').value.trim()
      };
      if(existing) Object.assign(existing, data);
      else TASKS.push({id:newId('task'), ...data});
      persist(); closeModal(); toast(existing?'Task updated':'Task created'); navigateTo(currentSection);
    }
  });
  document.getElementById('tmStatus').addEventListener('change', (e)=>{
    document.getElementById('tmBlockerWrap').style.display = e.target.value==='blocked' ? 'block' : 'none';
  });
  document.getElementById('tmWeekendsToggle').querySelectorAll('.subtab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('tmWeekendsToggle').querySelectorAll('.subtab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tmIncludeWeekends').value = btn.dataset.val;
    });
  });
  if(existing){
    document.getElementById('tmDeleteBtn').addEventListener('click', ()=>{
      TASKS = TASKS.filter(x=>x.id!==existing.id);
      persist(); closeModal(); toast('Task deleted'); navigateTo(currentSection);
    });
  }
}

      </div>
      <div class="field field-inline-check"><label style="margin:0;"><input type="checkbox" id="quBlockerFlag" ${tk.status==='blocked'?'checked':''}> Flag a blocker</label></div>
      <div class="field" id="quBlockerWrap" style="display:${tk.status==='blocked'?'block':'none'}"><label>Blocker reason</label><textarea id="quBlockerReason" placeholder="What's blocking this task?">${esc(tk.blockerReason||'')}</textarea></div>
      <div class="field field-inline-check"><label style="margin:0;"><input type="checkbox" id="quRequestSupport"> Request support on this task</label></div>
      <div class="field" id="quSupportWrap" style="display:none;">
        <label>What kind of support?</label>
        <input type="text" id="quSupportType" placeholder="e.g. Extra hands, subject expertise, review" style="margin-bottom:9px;">
        <textarea id="quSupportMsg" placeholder="Briefly describe what you need help with"></textarea>
      </div>
  `;
  openModal({
    title:'Add a quick update', sub:'Updates the task directly — every view stays in sync automatically.',
    saveLabel:'Post update',
    bodyHTML: renderFields(initialTask),
    onSave:()=>{
      const taskId = document.getElementById('quTask').value;
      const tk = TASKS.find(x=>x.id===taskId);
      if(!tk) return;
      const status = document.getElementById('quStatus').value;
      const isBlocked = document.getElementById('quBlockerFlag').checked;
      const blockerReason = document.getElementById('quBlockerReason').value.trim();
      const finalStatus = isBlocked ? 'blocked' : status;
      if(isBlocked && !blockerReason){ modalFormError('Add a blocker reason, or uncheck "Flag a blocker".'); return; }
      const comment = document.getElementById('quText').value.trim();
      const wantsSupport = document.getElementById('quRequestSupport').checked;
      const supportMsg = document.getElementById('quSupportMsg').value.trim();
      if(wantsSupport && !supportMsg){ modalFormError('Describe what you need help with, or uncheck "Request support".'); return; }

      tk.status = finalStatus;
      tk.progressPct = clamp(+document.getElementById('quProgress').value||0,0,100);
      tk.nextStep = document.getElementById('quNextStep').value.trim();
      tk.remainingDays = Math.max(0, +document.getElementById('quRemaining').value||0);
      tk.due = fromISO(document.getElementById('quDue').value);
      tk.blockerReason = isBlocked ? blockerReason : '';
      if(comment) tk.notes = (tk.notes?tk.notes+'\n':'') + `[${fmt(TODAY)}] ${comment}`;

      if(wantsSupport){
        REQUESTS.push({
          id:newId('req'), person:personId, project:tk.project, task:tk.id,
          type: document.getElementById('quSupportType').value.trim() || 'General support',
          message: supportMsg, date:toISO(TODAY), status:'open', helper:null, acceptedDate:null, comment:''
        });
      }
      persist(); closeModal(); toast('Update saved — synced across the portal'); navigateTo(currentSection);
    }
  });
  const projSel = document.getElementById('quProject');
  const taskSel = document.getElementById('quTask');
  const refreshTaskOptions = (selectTaskId)=>{
    const tasksInProject = myTasks.filter(t=>t.project===projSel.value);
    taskSel.innerHTML = tasksInProject.map(t=>`<option value="${t.id}" ${t.id===selectTaskId?'selected':''}>${esc(t.name)}</option>`).join('');
  };
  refreshTaskOptions(initialTask.id);
  const refreshBody = ()=>{
    const tk = TASKS.find(t=>t.id===taskSel.value);
    if(!tk) return;
    document.getElementById('modalBodyInner').innerHTML = renderFields(tk);
    wireFieldToggles();
    document.getElementById('quProject').value = tk.project;
    document.getElementById('quProject').addEventListener('change', ()=>{ refreshTaskOptions(); taskSel.dispatchEvent(new Event('change')); });
    document.getElementById('quTask').addEventListener('change', refreshBody);
  };
  function wireFieldToggles(){
    document.getElementById('quStatus').addEventListener('change', e=>{
      document.getElementById('quBlockerFlag').checked = e.target.value==='blocked';
      document.getElementById('quBlockerWrap').style.display = e.target.value==='blocked' ? 'block' : 'none';
    });
    document.getElementById('quBlockerFlag').addEventListener('change', e=>{
      document.getElementById('quBlockerWrap').style.display = e.target.checked ? 'block' : 'none';
      if(e.target.checked) document.getElementById('quStatus').value = 'blocked';
    });
    document.getElementById('quRequestSupport').addEventListener('change', e=>{
      document.getElementById('quSupportWrap').style.display = e.target.checked ? 'block' : 'none';
    });
  }
  projSel.addEventListener('change', ()=>{ refreshTaskOptions(); refreshBody(); });
  taskSel.addEventListener('change', refreshBody);
  wireFieldToggles();
}
function openRequestSupportModal(personId, presetProjectId, presetTaskId){
  const myProjects = projectsForPerson(personId);
  const myTasks = activeTasksForPerson(personId);
  openModal({
    title:'Request support', sub:'Visible to your teammates so anyone with capacity can offer to help.',
    saveLabel:'Send request',
    bodyHTML:`
      <div class="field-row">
        <div class="field"><label>Project</label>
          <select id="rsProject">${myProjects.map(p=>`<option value="${p.id}" ${(presetProjectId||myProjects[0]?.id)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Task (optional)</label>
          <select id="rsTask"><option value="">— General on this project —</option>${myTasks.map(t=>`<option value="${t.id}" data-proj="${t.project}" ${presetTaskId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Type of support needed</label><input type="text" id="rsType" placeholder="e.g. Extra hands, subject expertise, review"></div>
      <div class="field"><label>What do you need help with?</label><textarea id="rsText" placeholder="e.g. I need another hand on the Almaza consumer testing this week"></textarea></div>
    `,
    onSave:()=>{
      const text = document.getElementById('rsText').value.trim();
      if(!text){ modalFormError('Describe what you need before sending.'); return; }
      REQUESTS.push({
        id:newId('req'), person:personId, project:document.getElementById('rsProject').value,
        task: document.getElementById('rsTask').value || null,
        type: document.getElementById('rsType').value.trim() || 'General support',
        message:text, date:toISO(TODAY), status:'open', helper:null, acceptedDate:null, comment:''
      });
      persist(); closeModal(); toast('Request sent — your team can see it and offer to help'); navigateTo(currentSection);
    }
  });
  const projSel = document.getElementById('rsProject');
  const taskSel = document.getElementById('rsTask');
  const filterTasks = ()=>{
    Array.from(taskSel.options).forEach(opt=>{
      if(!opt.value) return;
      opt.hidden = opt.dataset.proj !== projSel.value;
    });
    if(taskSel.selectedOptions[0]?.hidden) taskSel.value = '';
  };
  filterTasks();
  projSel.addEventListener('change', filterTasks);
}

/* ---- Accept / manage a support request ---- */
function acceptSupportRequest(requestId, helperId){
  const req = REQUESTS.find(r=>r.id===requestId);
  if(!req) return;
  req.status = 'accepted'; req.helper = helperId; req.acceptedDate = toISO(TODAY);
  const tk = req.task ? TASKS.find(t=>t.id===req.task) : null;
  if(tk && !tk.assignee2 && tk.assignee!==helperId){
    tk.assignee2 = helperId;
    tk.notes = (tk.notes?tk.notes+'\n':'') + `[${fmt(TODAY)}] ${personById(helperId)?.name||'A teammate'} joined to help — support request accepted.`;
  }
  persist(); toast(`You're now helping with this — ${req.type}`); navigateTo(currentSection);
}
function closeSupportRequest(requestId){
  const req = REQUESTS.find(r=>r.id===requestId);
  if(!req) return;
  req.status = 'resolved';
  persist(); toast('Request closed'); navigateTo(currentSection);
}
function supportRequestCardHTML(req, opts){
  opts = opts || {};
  const person = personById(req.person);
  const proj = req.project ? projectById(req.project) : null;
  const task = req.task ? TASKS.find(t=>t.id===req.task) : null;
  const helper = req.helper ? personById(req.helper) : null;
  return `
    <div class="support-card status-${req.status}">
      <div class="support-top">
        ${avatarHTML(req.person,'sm')}
        <div class="support-who"><b>${esc(person?person.name:'Someone')}</b> needs support</div>
        <span class="tag priority-medium">${esc(req.type||'Support')}</span>
      </div>
      <div class="support-msg">${esc(req.message)}</div>
      <div class="support-meta">${proj?esc(proj.name):'General'}${task?' · '+esc(task.name):''} · <span class="mono">${fmt(fromISO(req.date))}</span></div>
      ${req.status==='accepted' ? `<div class="support-accepted">✓ ${esc(helper?helper.name:'A teammate')} is helping${req.acceptedDate?' since '+fmt(fromISO(req.acceptedDate)):''}</div>` : ''}
      ${req.status==='open' && opts.canAccept ? `<button class="btn btn-primary btn-sm" data-accept-req="${req.id}" style="margin-top:9px;">I can help</button>` : ''}
      ${opts.canManage && req.status!=='resolved' ? `<button class="linklike" data-close-req="${req.id}" style="margin-top:8px;">Mark resolved</button>` : ''}
    </div>
  `;
}
function wireSupportRequestCards(root, opts){
  opts = opts || {};
  root.querySelectorAll('[data-accept-req]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); acceptSupportRequest(btn.dataset.acceptReq, opts.viewerId||currentProfileId); });
  });
  root.querySelectorAll('[data-close-req]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); closeSupportRequest(btn.dataset.closeReq); });
  });
}
/* Team support widget — open requests from teammates (with an Accept action) plus the
   viewer's own requests and their live status. Used on the employee home & team capacity. */
function teamSupportWidgetHTML(personId){
  const fromOthers = REQUESTS.filter(r=>r.status==='open' && r.person!==personId);
  const mine = REQUESTS.filter(r=>r.person===personId && r.status!=='resolved').sort((a,b)=> a.status==='open'?-1:1);
  if(!fromOthers.length && !mine.length) return '';
  return `
    <div class="card">
      <div class="panel-head-row"><h2 style="font-size:16px;">Team support</h2></div>
      ${fromOthers.length ? `<div class="section-title" style="margin-top:0;">Where you can help</div>${fromOthers.map(r=>supportRequestCardHTML(r,{canAccept:true})).join('')}` : ''}
      ${mine.length ? `<div class="section-title" style="margin-top:${fromOthers.length?'16px':'0'};">Your requests</div>${mine.map(r=>supportRequestCardHTML(r,{})).join('')}` : ''}
      ${!fromOthers.length && !mine.length ? '<div class="empty-state">No open support requests right now.</div>' : ''}
    </div>
  `;
}

function renderPlanningCalendar(main){
  main.innerHTML = `
    <div class="panel-head-row">

        <button class="subtab-btn${pcSubtab==='planning'?' active':''}" data-sub="planning">Two-Week Planning</button>

      </div>
