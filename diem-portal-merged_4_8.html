/* ---- Two-week planning board ---- */
function planBlockSegmentClass(span, d){
  const first = dayDiff(span[0], d)===0, last = dayDiff(span[span.length-1], d)===0;
  if(span.length===1) return 'solo';
  if(first) return 'start';
  if(last) return 'end';
  return 'mid';
}
function renderPlanningBoard(body){
  const selectedIds = [planPersonFilter, planCompareFilter].filter(id=>id && id!=='all' && id!=='none');
  const people = selectedIds.length
    ? calendarRoster().filter(p=>selectedIds.includes(p.id))
    : calendarRoster();
  const days = Array.from({length:planRangeDays}, (_,i)=>addDays(TODAY,i));

  body.innerHTML = `
    <div class="filter-bar">
      <button class="filter-pill${planRangeDays===7?' active':''}" data-range="7">1 week</button>
      <button class="filter-pill${planRangeDays===14?' active':''}" data-range="14">2 weeks</button>
      <button class="filter-pill${planRangeDays===21?' active':''}" data-range="21">3 weeks</button>
      <div class="filter-sep"></div>
      <select class="filter-select" id="planPersonSelect">
        <option value="all">All team members</option>
        ${calendarRoster().map(p=>`<option value="${p.id}" ${planPersonFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      ${planPersonFilter!=='all' ? `
      <select class="filter-select" id="planCompareSelect">
        <option value="none">Compare with…</option>
        ${calendarRoster().filter(p=>p.id!==planPersonFilter).map(p=>`<option value="${p.id}" ${planCompareFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>` : ''}
      <select class="filter-select" id="planProjectSelect">
        <option value="all">All projects</option>
        ${PROJECTS.map(p=>`<option value="${p.id}" ${planProjectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
    <div class="plan-legend">
      <span><i class="pl-swatch not-started"></i>Not started</span>
      <span><i class="pl-swatch in-progress"></i>In progress</span>
      <span><i class="pl-swatch blocked"></i>Blocked</span>
      <span><i class="pl-swatch dayoff"></i>Approved day off</span>
      <span style="border-left:1px solid var(--border-soft); padding-left:14px;"><i class="pl-swatch" style="background:var(--client-fg);"></i>Client (left edge)</span>
      <span><i class="pl-swatch" style="background:var(--internal-fg);"></i>Internal (left edge)</span>
      <span><span class="plan-support-badge" style="background:var(--bg-deep); color:var(--ink-soft);">+1</span> Second assignee</span>
      <span><span style="display:inline-block; width:9px; height:9px; border-radius:2px; box-shadow:inset 0 0 0 1.5px var(--diem-orange);"></span> Overdue</span>
    </div>
    <div class="plan-wrap">
      <div class="plan-grid" style="grid-template-columns:220px repeat(${days.length}, minmax(132px,1fr));">
        <div class="plan-corner"></div>
        ${days.map(d=>`<div class="plan-head-cell${[0,6].includes(d.getDay())?' weekend':''}${dayDiff(TODAY,d)===0?' today':''}"><span class="dow">${DOW_SHORT[d.getDay()]}</span><span class="dnum">${d.getDate()}</span></div>`).join('')}
        ${people.map(person=>{
          const cap = person.roleType==='ceo' ? null : computeCapacity(person.id);
          return `
          <div class="plan-name-cell" data-add-for="${person.id}">${avatarHTML(person.id)}<div><span class="pn-name">${esc(person.name)}</span><span class="pn-role">${esc(person.role)}${cap?` · ${cap.pct}%`:''}</span></div><button class="icon-btn" data-add-task-for="${person.id}" title="Add task for ${esc(person.name)}" style="margin-left:auto;">+</button></div>
          ${days.map(d=>{
            const off = approvedDayOffOn(person.id, d);
            const dayTasks = TASKS.filter(tk=>{
              if(!isAssignedTo(tk,person.id) || tk.status==='done') return false;
              if(planProjectFilter!=='all' && tk.project!==planProjectFilter) return false;
              return taskWorkingDays(tk).some(sd=>dayDiff(sd,d)===0);
            });
            return `<div class="plan-day-cell${[0,6].includes(d.getDay())?' weekend':''}${dayDiff(TODAY,d)===0?' today':''}">
              ${off ? `<div class="plan-block dayoff" data-dayoff="${off.id}" title="${esc(off.type)} — ${esc(person.name)}">${dayDiff(fromISO(off.startDate),d)===0?'🌴 '+esc(off.type):''}</div>` : ''}
              ${!off ? dayTasks.map(tk=>{
                const span = taskWorkingDays(tk);
                const seg = planBlockSegmentClass(span, d);
                const proj = projectById(tk.project);
                const typeAccent = proj ? (proj.type==='client' ? 'var(--client-fg)' : 'var(--internal-fg)') : 'transparent';
                const overdue = tk.status!=='blocked' && dayDiff(TODAY,tk.due)<0;
                const showTypeAccent = seg==='start' || seg==='solo';
                return `<div class="plan-block ${tk.status} seg-${seg}${overdue?' plan-overdue':''}" data-task="${tk.id}" style="${showTypeAccent?`border-left:3px solid ${typeAccent};`:''}" title="${esc(tk.name)} · ${tk.workloadDays}d${proj?' · '+(proj.type==='client'?'Client':'Internal'):''}${tk.assignee2?' · shared with '+esc(personById(tk.assignee2)?.name||''):''}${overdue?' · overdue':''}">${seg==='mid'||seg==='end'?'':esc(tk.name)}${(seg==='start'||seg==='solo')&&tk.assignee2?' <span class="plan-support-badge" title="Second assignee: '+esc(personById(tk.assignee2)?.name||'')+'">+1</span>':''}</div>`;
              }).join('') : ''}
            </div>`;
          }).join('')}
        `;}).join('')}
      </div>
    </div>
  `;
  body.querySelectorAll('[data-range]').forEach(btn=>btn.addEventListener('click', ()=>{ planRangeDays=+btn.dataset.range; renderPlanningBoard(body); }));
  document.getElementById('planPersonSelect').addEventListener('change', e=>{ planPersonFilter=e.target.value; if(planPersonFilter==='all') planCompareFilter='none'; renderPlanningBoard(body); });
  const cmpSel = document.getElementById('planCompareSelect');
  if(cmpSel) cmpSel.addEventListener('change', e=>{ planCompareFilter=e.target.value; renderPlanningBoard(body); });
  document.getElementById('planProjectSelect').addEventListener('change', e=>{ planProjectFilter=e.target.value; renderPlanningBoard(body); });
  body.querySelectorAll('.plan-block[data-task]').forEach(el=> el.addEventListener('click', ()=> openTaskModal(el.dataset.task)));
  body.querySelectorAll('[data-add-task-for]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openTaskModal(null, {presetPerson:btn.dataset.addTaskFor}); });
  });
}

/* ---- Calendar (Google-Calendar-inspired) ---- */
function calMatchesFilters(tk){
  if(planPersonFilter!=='all' && !isAssignedTo(tk,planPersonFilter)) return false;
  if(planProjectFilter!=='all' && tk.project!==planProjectFilter) return false;
  return tk.status!=='done';
}
function eventColor(tk){
  if(tk.status==='blocked') return {bg:'var(--stage-blocked-bg)', fg:'var(--health-blocked)'};
  if(tk.status==='in-progress') return {bg:'var(--stage-prog-bg)', fg:'var(--stage-prog-fg)'};
  return {bg:'var(--stage-ns-bg)', fg:'var(--stage-ns-fg)'};
}
function dayOffOnDay(d){
  return DAYOFF.filter(off=> off.status==='approved' && dayOffOverlapsDate(off,d)
    && (planPersonFilter==='all' || off.person===planPersonFilter));
}
function renderCalendarView(body){
  body.innerHTML = `
    <div class="cal-controls">
      <div class="cal-control-group">
        <button class="icon-btn" id="calPrevBtn">←</button>
        <span style="font-weight:700; font-size:14.5px; min-width:170px; text-align:center; display:inline-block;" id="calCursorLabel"></span>
        <button class="icon-btn" id="calNextBtn">→</button>
        <button class="btn btn-ghost btn-sm" id="calTodayBtn">Today</button>
      </div>
      <div class="cal-control-group">
        <select class="filter-select" id="calPersonSelect">
          <option value="all">All team members</option>
          ${calendarRoster().map(p=>`<option value="${p.id}" ${planPersonFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <select class="filter-select" id="calProjectSelect">
          <option value="all">All projects</option>
          ${PROJECTS.map(p=>`<option value="${p.id}" ${planProjectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <div class="subtabs">
          ${['day','week','2weeks','month'].map(m=>`<button class="subtab-btn${calViewMode===m?' active':''}" data-view="${m}">${m==='2weeks'?'2 Weeks':cap1(m)}</button>`).join('')}
        </div>
      </div>
    </div>
    <div id="calGrid"></div>
  `;
  document.getElementById('calPrevBtn').onclick = ()=>{ calStep(-1); renderCalendarView(body); };
  document.getElementById('calNextBtn').onclick = ()=>{ calStep(1); renderCalendarView(body); };
  document.getElementById('calTodayBtn').onclick = ()=>{ calCursor = new Date(TODAY); renderCalendarView(body); };
  document.getElementById('calPersonSelect').onchange = e=>{ planPersonFilter=e.target.value; renderCalendarView(body); };
  document.getElementById('calProjectSelect').onchange = e=>{ planProjectFilter=e.target.value; renderCalendarView(body); };
  body.querySelectorAll('[data-view]').forEach(btn=> btn.onclick = ()=>{ calViewMode=btn.dataset.view; renderCalendarView(body); });

  const label = document.getElementById('calCursorLabel');
  const grid = document.getElementById('calGrid');
  if(calViewMode==='month'){
    label.textContent = `${MONTH_NAMES[calCursor.getMonth()]} ${calCursor.getFullYear()}`;
    grid.innerHTML = calMonthGridHTML(calCursor);
  } else if(calViewMode==='day'){
    label.textContent = fmtLong(calCursor);
    grid.innerHTML = calDayListHTML(calCursor);
  } else {
    const weeks = calViewMode==='2weeks' ? 2 : 1;
    const start = addDays(calCursor, -calCursor.getDay());
    label.textContent = `${fmt(start)} – ${fmt(addDays(start,7*weeks-1))}`;
    grid.innerHTML = calWeekGridHTML(start, weeks);
  }
  grid.querySelectorAll('[data-task]').forEach(el=> el.addEventListener('click', ()=> openTaskModal(el.dataset.task)));
}
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function calStep(dir){
  if(calViewMode==='month') calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+dir, 1);
  else if(calViewMode==='day') calCursor = addDays(calCursor, dir);
  else calCursor = addDays(calCursor, dir*7*(calViewMode==='2weeks'?2:1));
}
function tasksOnDay(d){ return TASKS.filter(tk=>calMatchesFilters(tk) && taskWorkingDays(tk).some(sd=>dayDiff(sd,d)===0)); }

function calMonthGridHTML(cursor){
  const year=cursor.getFullYear(), month=cursor.getMonth();
  const firstOfMonth = new Date(year,month,1);
  const gridStart = addDays(firstOfMonth, -firstOfMonth.getDay());
  const cells = Array.from({length:42}, (_,i)=>addDays(gridStart,i));
  return `
    <div class="cal-month-grid" style="border-left:1px solid var(--border-soft); border-top:1px solid var(--border-soft); border-radius:var(--radius-lg); overflow:hidden; background:var(--surface); box-shadow:var(--shadow);">
      ${DOW_SHORT.map(d=>`<div class="cal-dow-head" style="border-right:1px solid var(--border-soft);">${d}</div>`).join('')}
      ${cells.map(d=>{
        const evs = tasksOnDay(d);
        const offs = dayOffOnDay(d);
        const isToday = dayDiff(TODAY,d)===0;
        const other = d.getMonth()!==month;
        return `<div class="cal-month-cell${other?' other-month':''}${isToday?' today':''}" style="border-right:1px solid var(--border-soft);">
          <span class="cdate">${d.getDate()}</span>
          ${offs.slice(0,2).map(off=>`<div class="cal-event dayoff" title="${esc(off.type)}">🌴 ${esc(personById(off.person)?.name.split(' ')[0]||'')}</div>`).join('')}
          ${evs.slice(0,3).map(tk=>{ const c=eventColor(tk); return `<div class="cal-event" data-task="${tk.id}" style="background:${c.bg}; color:${c.fg}; cursor:pointer;">${esc(tk.name)}</div>`; }).join('')}
          ${evs.length>3?`<div style="font-size:9.5px; color:var(--ink-faint); padding-left:2px;">+${evs.length-3} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}
function calWeekGridHTML(start, numWeeks){
  let rows = '';
  for(let w=0; w<numWeeks; w++){
    const weekDays = Array.from({length:7},(_,i)=>addDays(start, w*7+i));

/* ============================================================
   WEEKLY RECAP LIFECYCLE — finalize / rollover / history
   Every week's Next Steps become next week's Last Agreed Points.
   Finalizing writes an immutable snapshot keyed by ISO week; the
   rollover reads the most recent snapshot before the current week
   and never regenerates or duplicates it on repeat page loads.
   ============================================================ */
const WEEKLY_KEY = 'diem-portal-weekly-snapshots-v1';
let WEEKLY_SNAPSHOTS = [];
let recapViewWeekId = null; // null = current week; else a historical weekId being viewed read-only

function isoWeekInfo(date){
  const d = startOfDay(date);
  const dow = (d.getDay()+6)%7; // Monday=0 .. Sunday=6
  const weekStart = addDays(d, -dow);
  const weekEnd = addDays(weekStart, 6);
  const thursday = addDays(weekStart, 3);
  const year = thursday.getFullYear();
  const jan1 = new Date(year,0,1);
  const jan1Dow = (jan1.getDay()+6)%7;
  const firstThursday = addDays(jan1, 3-jan1Dow);
  const week = 1 + Math.round((thursday-firstThursday)/(7*86400000));
  return {weekId:`${year}-W${String(week).padStart(2,'0')}`, weekStart, weekEnd, year, week};
}
const CURRENT_WEEK = isoWeekInfo(TODAY);

const sortedSnapshotsDesc = () => [...WEEKLY_SNAPSHOTS].sort((a,b)=> a.weekId<b.weekId?1:(a.weekId>b.weekId?-1:0));
function findSnapshot(weekId){ return WEEKLY_SNAPSHOTS.find(s=>s.weekId===weekId); }
function latestFinalizedSnapshot(beforeWeekId){
  const list = sortedSnapshotsDesc();
  if(!beforeWeekId) return list[0] || null;
  return list.find(s=> s.weekId < beforeWeekId) || null;
}
function isCurrentWeekFinalized(){ return !!findSnapshot(CURRENT_WEEK.weekId); }
function previousWeekNeedsFinalizing(){
  if(!WEEKLY_SNAPSHOTS.length) return false;
  const latest = latestFinalizedSnapshot(null);
  return latest && latest.weekId !== CURRENT_WEEK.weekId;
}

function buildWeeklySnapshotPayload(){
  const stats = portfolioStats();
  const attention = ceoAttentionItems();
  const recs = generateRecommendations();
  const capRows = capacityRoster().map(p=>({person:p, cap:computeCapacity(p.id)}));
  const nextSteps = computeNextSteps(null).map(s=>({
    id:s.id, action:s.action, project:s.project, assignee:s.assignee, assignee2:s.assignee2,
    due: toISO(s.due), priority:s.priority, dependency:s.dependency, approvalPerson:s.approvalPerson
  }));
  return {
    id: newId('wk'),
    weekId: CURRENT_WEEK.weekId,
    weekStart: toISO(CURRENT_WEEK.weekStart),
    weekEnd: toISO(CURRENT_WEEK.weekEnd),
    finalizedAt: new Date().toISOString(),
    finalizedBy: currentProfileId,
    execSummary: buildExecutiveSummary(stats, attention, capRows),
    kpis: {activeProjects:stats.activeProjects, typeCounts:{...stats.typeCounts}, stageCounts:{...stats.stageCounts}, healthCounts:{...stats.healthCounts}},
    needsAttentionCount: attention.length,
    recommendationCount: recs.length,
    decisionsWaitingCount: buildNeedsAttention().filter(a=>a.kind==='approval'||a.kind==='decision').length,
    teamOverloadedCount: capRows.filter(r=>r.cap.needsAttention).length,
    nextSteps
  };
}
function finalizeWeeklyRecap(){
  if(!currentCan('canFinalizeRecap')){ toast('You do not have permission to finalize the weekly recap.'); return; }
  if(findSnapshot(CURRENT_WEEK.weekId)){ toast('This week is already finalized.'); return; }
  WEEKLY_SNAPSHOTS.push(buildWeeklySnapshotPayload());
  persistWeeklySnapshots();
  toast('Weekly recap finalized — next week these next steps become Last Agreed Points.');
}
function persistWeeklySnapshots(){ storageSet(WEEKLY_KEY, JSON.stringify(WEEKLY_SNAPSHOTS)); }
function deleteSnapshot(weekId){
  WEEKLY_SNAPSHOTS = WEEKLY_SNAPSHOTS.filter(s=>s.weekId!==weekId);
  persistWeeklySnapshots();
}

const ROLLOVER_STATUS_LABEL = {agreed:'Agreed','in-progress':'In Progress',completed:'Completed',blocked:'Blocked',overdue:'Overdue',cancelled:'Cancelled'};
const ROLLOVER_STATUS_CLASS = {agreed:'balanced','in-progress':'balanced',completed:'available',blocked:'overloaded',overdue:'overloaded',cancelled:'balanced'};
// This week's "Last Agreed Points" = last week's finalized Next Steps, with live execution status.
// Stable IDs (rooted in the original task id + origin week) keep this idempotent across reloads.
function rolledOverAgreedPoints(scopePersonId){
  const prev = latestFinalizedSnapshot(CURRENT_WEEK.weekId);
  if(!prev) return [];
  let items = prev.nextSteps.map(ns=>{
    const task = TASKS.find(t=>t.id===ns.id);
    let status;
    if(!task) status='cancelled';
    else if(task.status==='done') status='completed';
    else if(task.status==='blocked') status='blocked';
    else if(dayDiff(TODAY, task.due)<0) status='overdue';
    else status='in-progress';
    return {
      id:'roll_'+ns.id+'_'+prev.weekId, taskId:ns.id, action:ns.action, project:ns.project,
      owner:ns.assignee, owner2:ns.assignee2, dueDate:ns.due, originWeek:prev.weekId,
      status, carriedOver: !!task && task.status!=='done', exists: !!task
    };
  });
  if(scopePersonId) items = items.filter(it=> it.owner===scopePersonId || it.owner2===scopePersonId);
  return items;
}

/* ============================================================
   "CHANGES SINCE PREVIOUS RECAP" — snapshot + diff
   ============================================================ */
function computeRecapSnapshot(){
  return {
    ts: Date.now(),
    doneTaskIds: TASKS.filter(tk=>tk.status==='done').map(tk=>tk.id),
    openBlockerIds: BLOCKERS.filter(b=>b.status==='open').map(b=>b.id),
    overloadedIds: capacityRoster().filter(p=>computeCapacity(p.id).band==='overloaded').map(p=>p.id),
    projectHealth: Object.fromEntries(PROJECTS.map(p=>[p.id, computeHealth(p)])),
    projectProgress: Object.fromEntries(PROJECTS.map(p=>[p.id, projectProgress(p)])),
    agreedPointIds: AGREED_POINTS.map(a=>a.id),
    overdueTaskIds: TASKS.filter(tk=>tk.status!=='done' && dayDiff(TODAY,tk.due)<0).map(tk=>tk.id)
  };
}
function diffRecapSnapshots(oldSnap, newSnap){
  if(!oldSnap) return [];
  const changes = [];
  newSnap.doneTaskIds.filter(id=>!oldSnap.doneTaskIds.includes(id)).forEach(id=>{
    const tk = TASKS.find(x=>x.id===id); if(!tk) return;
    changes.push({dir:'new', sentiment:'good', kind:'task', label:`Completed — ${tk.name}`, sub:projectById(tk.project)?.name||'', project:tk.project});
  });
  newSnap.openBlockerIds.filter(id=>!oldSnap.openBlockerIds.includes(id)).forEach(id=>{
    const b = BLOCKERS.find(x=>x.id===id); if(!b) return;
    changes.push({dir:'new', sentiment:'bad', kind:'blocker', label:`New blocker — ${b.title}`, sub:projectById(b.project)?.name||'', project:b.project});
  });
  oldSnap.openBlockerIds.filter(id=>!newSnap.openBlockerIds.includes(id)).forEach(id=>{
    const b = BLOCKERS.find(x=>x.id===id); if(!b) return;
    changes.push({dir:'resolved', sentiment:'good', kind:'blocker', label:`Resolved — ${b.title}`, sub:projectById(b.project)?.name||'', project:b.project});
  });
  newSnap.overloadedIds.filter(id=>!oldSnap.overloadedIds.includes(id)).forEach(id=>{
    const p = personById(id); if(!p) return;
    changes.push({dir:'increased', sentiment:'bad', kind:'person', label:`${p.name} is newly overloaded`, sub:'Team capacity', person:id});
  });
  oldSnap.overloadedIds.filter(id=>!newSnap.overloadedIds.includes(id) && personById(id)).forEach(id=>{
    const p = personById(id);
    changes.push({dir:'decreased', sentiment:'good', kind:'person', label:`${p.name} is no longer overloaded`, sub:'Team capacity', person:id});
  });
  Object.keys(newSnap.projectHealth).forEach(pid=>{
    const oldH = oldSnap.projectHealth[pid], newH = newSnap.projectHealth[pid];
    if(oldH && newH && oldH!==newH){
      const p = projectById(pid); if(!p) return;
      const worse = HEALTH_RANK[newH] > HEALTH_RANK[oldH];
      changes.push({dir: worse?'decreased':'increased', sentiment: worse?'bad':'good', kind:'project', label:`${p.name}: ${HEALTH_LABEL[oldH]} → ${HEALTH_LABEL[newH]}`, sub:'Project status changed', project:pid});
    }
  });
  Object.keys(newSnap.projectProgress).forEach(pid=>{
    const oldP = oldSnap.projectProgress[pid], newP = newSnap.projectProgress[pid];
    if(oldP!=null && newP!=null && oldP!==newP){
      const p = projectById(pid); if(!p) return;
      const up = newP>oldP;
      changes.push({dir: up?'increased':'decreased', sentiment: up?'good':'bad', kind:'project', label:`${p.name} progress: ${oldP}% → ${newP}%`, sub:'', project:pid});
    }
  });
  newSnap.agreedPointIds.filter(id=>!oldSnap.agreedPointIds.includes(id)).forEach(id=>{
    const a = AGREED_POINTS.find(x=>x.id===id); if(!a) return;
    changes.push({dir:'new', sentiment:'neutral', kind:'agreed', label:`New agreed point — ${a.text.length>72?a.text.slice(0,72)+'…':a.text}`, sub:projectById(a.project)?.name||'General', project:a.project});
  });
  const newOverdue = newSnap.overdueTaskIds.filter(id=>!oldSnap.overdueTaskIds.includes(id));
  if(newOverdue.length) changes.push({dir:'increased', sentiment:'bad', kind:'overdue', label:`${newOverdue.length} task${newOverdue.length===1?'':'s'} newly overdue`, sub:'Across the team'});
  const sevOrder = {new:0, increased:1, resolved:2, decreased:3};
  return changes.sort((a,b)=>(sevOrder[a.dir]??9)-(sevOrder[b.dir]??9));
}
function getRecapChanges(scopePersonId){
  const changes = diffRecapSnapshots(RECAP_SNAPSHOT, computeRecapSnapshot());
  if(!scopePersonId) return changes;
  return changes.filter(c=>{
    if(c.person) return c.person===scopePersonId;
    if(c.project){ const p=projectById(c.project); return p && (p.team.includes(scopePersonId)||p.owner===scopePersonId); }
    return false;
  });
}
function persistRecapSnapshot(){
  const snap = computeRecapSnapshot();
  RECAP_SNAPSHOT = snap;
  storageSet(SNAPSHOT_KEY, JSON.stringify(snap));
}

/* ============================================================
   NEXT STEPS — derived from real tasks (never invented)
   ============================================================ */
function computeNextSteps(scopePersonId){
  const active = TASKS.filter(tk=>tk.status!=='done');
  const steps = active.map(tk=>{
    const overdue = dayDiff(TODAY,tk.due)<0;
    const waitingApproval = !!tk.approvalPerson;
    const waitingInfo = !!tk.dependency && tk.status!=='blocked';
    return {
      task: tk, id:tk.id, action: tk.nextStep || tk.name, taskName: tk.name, project:tk.project,
      assignee:tk.assignee, assignee2:tk.assignee2, due:tk.due, priority:tk.priority,
      status:tk.status, overdue, blocked: tk.status==='blocked',
      remainingDays: tk.remainingDays!=null ? tk.remainingDays : tk.workloadDays,
      dependency: tk.status==='blocked' ? tk.blockerReason : (tk.dependency||''),
      approvalPerson: tk.approvalPerson||null, waitingApproval, waitingInfo
    };
  });
  const priRank = {high:0, medium:1, low:2};
  steps.sort((a,b)=>{
    if(a.overdue!==b.overdue) return a.overdue? -1:1;
    if(priRank[a.priority]!==priRank[b.priority]) return priRank[a.priority]-priRank[b.priority];
    return a.due-b.due;
  });
  if(!scopePersonId) return steps;
  return steps.filter(s=> s.assignee===scopePersonId || s.assignee2===scopePersonId || s.approvalPerson===scopePersonId);
}

/* ---- Executive / personal summary lines (built only from real computed numbers) ---- */
function buildExecutiveSummary(stats, attention, capRows){
  const overloaded = capRows.filter(r=>r.cap.band==='overloaded').length;
  const projectAttn = attention.filter(a=>a.kind==='project').length;
  const pendingDecisions = AGREED_POINTS.filter(a=>a.status==='pending').length;
  const parts = [];
  parts.push(`<b>${stats.activeProjects} active projects</b> — ${stats.typeCounts.client} client, ${stats.typeCounts.internal} internal.`);
  parts.push(projectAttn ? `<b>${projectAttn} project${projectAttn===1?'':'s'}</b> need${projectAttn===1?'s':''} attention this week.` : 'No projects currently need urgent attention.');
  parts.push(overloaded ? `<b>${overloaded} team member${overloaded===1?'':'s'}</b> ${overloaded===1?'is':'are'} overloaded.` : 'The team is within capacity.');
  parts.push(pendingDecisions ? `<b>${pendingDecisions} decision${pendingDecisions===1?'':'s'}</b> ${pendingDecisions===1?'is':'are'} still pending confirmation.` : 'No decisions are pending confirmation.');
  return parts.join(' ');
}
function buildPersonalSummary(personId){
  const cap = computeCapacity(personId);
  const steps = computeNextSteps(personId);
  const overdue = steps.filter(s=>s.overdue).length;
  const dueSoon = steps.filter(s=>!s.overdue && dayDiff(TODAY,s.due)<=7).length;
  const blocked = steps.filter(s=>s.blocked).length;
  const myProjCount = projectsForPerson(personId).length;
  const parts = [];
  parts.push(`You have <b>${steps.length} open task${steps.length===1?'':'s'}</b> across ${myProjCount} project${myProjCount===1?'':'s'}.`);
  if(overdue) parts.push(`<b>${overdue} ${overdue===1?'is':'are'} overdue</b>.`);
  if(dueSoon) parts.push(`${dueSoon} due within the week.`);
  if(blocked) parts.push(`<b>${blocked} blocked</b>.`);
  parts.push(`Current capacity: <b>${cap.pct}%</b>${cap.needsAttention?' — flagged for support.':'.'}`);
  return parts.join(' ');
}

function progressHighlights(){

  // a snapshot of the most meaningful current progress so the section is never fabricated.
  const changes = getRecapChanges(null).filter(c=>c.sentiment==='good').slice(0,5);
  if(changes.length) return changes.map(c=>({label:c.label, sub:c.sub||''}));
  const doneTasks = TASKS.filter(tk=>tk.status==='done').slice(0,3).map(tk=>({label:`Completed — ${tk.name}`, sub:projectById(tk.project)?.name||''}));
  const highProgress = [...PROJECTS].filter(p=>{ const pct=projectProgress(p); return pct>=50 && pct<100; })

   ============================================================ */
const LEAVE_TYPES = ['Vacation','Sick leave','Personal','Public holiday','Other'];
let dayOffAdminFilter = 'pending';
function renderDayOff(main){
  const p = currentProfile();
  if(currentCan('canApproveDayOff')) renderDayOffAdmin(main);
  else renderDayOffEmployee(main, p.id);
}
function markDayOffDecisionsSeen(personId){
  const unseen = unseenDayOffDecisions(personId);
  if(!unseen.length) return;
  unseen.forEach(d=> d.employeeSeen = true);
  persist(); renderShell();
}
function dayOffRowHTML(d, opts){
  opts = opts || {};
  const person = personById(d.person);
  const span = d.startDate===d.endDate ? fmt(fromISO(d.startDate)) : `${fmt(fromISO(d.startDate))} – ${fmt(fromISO(d.endDate))}`;
  return `
    <div class="dayoff-row">
      <div class="dayoff-main">
        ${opts.showPerson!==false ? avatarHTML(d.person,'sm') : ''}
        <div>
          <div class="dayoff-top">${opts.showPerson!==false?`<b>${esc(person?person.name:'')}</b> · `:''}${esc(d.type)}<span class="cap-status-pill ${d.status==='approved'?'available':d.status==='rejected'?'overloaded':'balanced'}" style="margin-left:8px;">${cap1(d.status)}</span>${d.employeeSeen===false?'<span class="nav-badge" style="margin-left:8px; position:static;">New</span>':''}</div>
          <div class="dayoff-sub">${span}${d.note?' · '+esc(d.note):''}</div>
          ${d.status!=='pending' ? `<div class="dayoff-sub">Decided ${d.decidedDate?fmt(fromISO(d.decidedDate)):''}${d.decidedBy?' by '+esc(personById(d.decidedBy)?.name||''):''}</div>` : ''}
          ${d.comment ? `<div class="dayoff-sub" style="font-style:italic;">💬 ${esc(d.comment)}</div>` : ''}
        </div>
      </div>
      ${opts.canDecide && d.status==='pending' ? `
      <div class="dayoff-actions">
        <button class="btn btn-ghost btn-sm" data-reject-off="${d.id}">Reject</button>
        <button class="btn btn-primary btn-sm" data-approve-off="${d.id}">Approve</button>
      </div>` : ''}
    </div>
  `;
}
function renderDayOffEmployee(main, personId){
  const mine = DAYOFF.filter(d=>d.person===personId).sort((a,b)=> b.submittedDate<a.submittedDate?-1:1);
  const pending = mine.filter(d=>d.status==='pending');
  const decided = mine.filter(d=>d.status!=='pending');
  main.innerHTML = `
    <div class="panel-head-row"><h2 style="font-size:16px;">My time off</h2><button class="btn btn-primary btn-sm" id="doNewBtn">+ Request day off</button></div>
    <div class="two-col">
      <div class="stack-gap">
        <div class="card">
          <div class="panel-head-row"><h2 style="font-size:16px;">Pending requests</h2></div>
          ${pending.length ? pending.map(d=>dayOffRowHTML(d,{showPerson:false})).join('') : '<div class="empty-state">No pending requests.</div>'}
        </div>
        <div class="card">
          <div class="panel-head-row"><h2 style="font-size:16px;">History</h2></div>
          ${decided.length ? decided.map(d=>dayOffRowHTML(d,{showPerson:false})).join('') : '<div class="empty-state">No past requests yet.</div>'}
        </div>
      </div>
      <div class="card">
        <div class="section-title">How it works</div>
        <p style="font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin:0;">Submit a request with your dates and leave type. Paul and Tracy will review it — once approved, it automatically appears on the team calendar and two-week planning view, and your availability updates accordingly.</p>
      </div>
    </div>
  `;
  document.getElementById('doNewBtn').onclick = ()=> openDayOffModal(personId);
  markDayOffDecisionsSeen(personId);
}
function renderDayOffAdmin(main){
  const all = [...DAYOFF].sort((a,b)=> b.submittedDate<a.submittedDate?-1:1);
  const pending = all.filter(d=>d.status==='pending');
  const decided = all.filter(d=>d.status!=='pending');
  const list = dayOffAdminFilter==='pending' ? pending : dayOffAdminFilter==='all' ? all : decided;
  main.innerHTML = `
    <div class="panel-head-row">
      <div class="filter-bar" style="margin-bottom:0;">
        <button class="filter-pill${dayOffAdminFilter==='pending'?' active':''}" data-doaf="pending">Pending <span class="cnt">${pending.length}</span></button>
        <button class="filter-pill${dayOffAdminFilter==='decided'?' active':''}" data-doaf="decided">Decided <span class="cnt">${decided.length}</span></button>
        <button class="filter-pill${dayOffAdminFilter==='all'?' active':''}" data-doaf="all">All <span class="cnt">${all.length}</span></button>
      </div>
    </div>
    <div class="card">
      ${list.length ? list.map(d=>dayOffRowHTML(d,{canDecide:true})).join('') : '<div class="empty-state">Nothing here.</div>'}
    </div>
  `;
  main.querySelectorAll('[data-doaf]').forEach(btn=> btn.onclick = ()=>{ dayOffAdminFilter=btn.dataset.doaf; renderDayOffAdmin(main); });
  main.querySelectorAll('[data-approve-off]').forEach(btn=> btn.onclick = ()=> decideDayOff(btn.dataset.approveOff, 'approved'));
  main.querySelectorAll('[data-reject-off]').forEach(btn=> btn.onclick = ()=> decideDayOff(btn.dataset.rejectOff, 'rejected'));
}
function decideDayOff(id, decision){
  const d = DAYOFF.find(x=>x.id===id);
  if(!d) return;
  openModal({
    title: decision==='approved' ? 'Approve this request?' : 'Reject this request?',
    sub: `${personById(d.person)?.name||''} · ${d.type}`,
    saveLabel: decision==='approved' ? 'Approve' : 'Reject',
    bodyHTML: `<div class="field"><label>Comment (optional)</label><textarea id="doComment" placeholder="Anything the employee should know?"></textarea></div>`,
    onSave: ()=>{
      d.status = decision; d.comment = document.getElementById('doComment').value.trim();
      d.decidedBy = currentProfileId; d.decidedDate = toISO(TODAY); d.employeeSeen = false;
      persist(); closeModal();
      toast(decision==='approved' ? 'Approved — calendar and capacity updated' : 'Request rejected');
      navigateTo('dayoff');
    }
  });
}
function openDayOffModal(personId){
  openModal({
    title:'Request day off', saveLabel:'Submit request',
    bodyHTML:`
      <div class="field-row">
        <div class="field"><label>Start date</label><input type="date" id="doStart" value="${toISO(addDays(TODAY,7))}"></div>
        <div class="field"><label>End date</label><input type="date" id="doEnd" value="${toISO(addDays(TODAY,7))}"></div>
      </div>
      <div class="field"><label>Type of leave</label><select id="doType">${LEAVE_TYPES.map(t=>`<option value="${t}">${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label>Note (optional)</label><textarea id="doNote" placeholder="Anything worth mentioning?"></textarea></div>
    `,
    onSave:()=>{
      const start = document.getElementById('doStart').value, end = document.getElementById('doEnd').value;
      if(!start || !end){ modalFormError('Choose a start and end date.'); return; }
      if(end<start){ modalFormError('End date must be on or after the start date.'); return; }
      DAYOFF.push({
        id:newId('do'), person:personId, startDate:start, endDate:end,
        type: document.getElementById('doType').value, note: document.getElementById('doNote').value.trim(),
        submittedDate: toISO(TODAY), status:'pending', comment:'', decidedBy:null, decidedDate:null
      });
      persist(); closeModal(); toast('Request submitted — Paul and Tracy have been notified'); navigateTo('dayoff');
    }
  });
}


function openPersonModal(existingId){
  const existing = existingId ? personById(existingId) : null;
  const palette = ['#FF4F14','#4747F2','#00BA9E','#B87A12','#6456A6','#14131B','#039C85'];
  openModal({
    title: existing ? 'Edit team member' : 'Add team member',
    saveLabel: existing ? 'Save changes' : 'Add member',
    extraFootHTML: (existing && existing.roleType!=='ceo') ? `<button class="btn btn-danger btn-sm" id="pmPersonDeleteBtn" type="button">Remove</button>` : '',
    bodyHTML:`
      <div class="field"><label>Full name</label><input type="text" id="ppName" value="${esc(existing?existing.name:'')}" placeholder="e.g. Maya Younes"></div>
      <div class="field-row">
        <div class="field"><label>Role / title</label><input type="text" id="ppRole" value="${esc(existing?existing.role:'')}" placeholder="e.g. Consultant"></div>
        <div class="field"><label>Email</label><input type="email" id="ppEmail" value="${esc(existing?existing.email:'')}" placeholder="name@diem.co"></div>
      </div>

          <select id="ppRoleType" ${existing&&existing.roleType==='ceo'?'disabled':''}>

            ${existing&&existing.roleType==='ceo'?'<option value="ceo" selected>CEO</option>':''}
          </select>
        </div>
        <div class="field"><label>Capacity baseline (working days / 2 weeks)</label><input type="number" id="ppBaseline" min="1" max="10" step="0.5" value="${existing?existing.capacityBaseline:8}"></div>
      </div>

      ${(!existing || existing.roleType!=='ceo') ? `
      <div class="field">
        <label>Permissions</label>
        <div class="chip-select-row">
          <label class="field-inline-check" style="background:var(--bg-deep); padding:7px 13px; border-radius:999px;"><input type="checkbox" id="ppPermProjects" ${existing&&personPermissions(existing).canCreateProjects?'checked':''} style="width:auto;"> Create projects</label>

          <label class="field-inline-check" style="background:var(--bg-deep); padding:7px 13px; border-radius:999px;"><input type="checkbox" id="ppPermRecap" ${existing&&personPermissions(existing).canFinalizeRecap?'checked':''} style="width:auto;"> Finalize weekly recap</label>
          <label class="field-inline-check" style="background:var(--bg-deep); padding:7px 13px; border-radius:999px;"><input type="checkbox" id="ppPermDocs" ${existing&&personPermissions(existing).canUploadDocuments?'checked':''} style="width:auto;"> Upload documents</label>
        </div>
      </div>` : `<div class="field-hint">The CEO / General Manager profile always has full access.</div>`}
    `,
    onSave:()=>{
      const name = document.getElementById('ppName').value.trim();
      if(!name){ modalFormError('Give this person a name.'); return; }
      const skills = document.getElementById('ppSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
      const permEls = {p1:document.getElementById('ppPermProjects'), p2:document.getElementById('ppPermTeam'), p3:document.getElementById('ppPermRecap'), p4:document.getElementById('ppPermDocs')};
      const data = {
        name, role: document.getElementById('ppRole').value.trim()||'Team member',
        email: document.getElementById('ppEmail').value.trim(),
        roleType: document.getElementById('ppRoleType').value,
        capacityBaseline: clamp(+document.getElementById('ppBaseline').value||8,1,10),
        skills,
        permissions: {
          canCreateProjects: permEls.p1 ? permEls.p1.checked : true,
          canEditTeam: permEls.p2 ? permEls.p2.checked : true,
          canFinalizeRecap: permEls.p3 ? permEls.p3.checked : true,
          canUploadDocuments: permEls.p4 ? permEls.p4.checked : true
        }
      };
      if(existing) Object.assign(existing, data);
      else {
        const solid = palette[PEOPLE.length % palette.length];
        PEOPLE.push({id:newId('person'), ringA:solid, ringB:palette[(PEOPLE.length+2)%palette.length], solid, ...data});
      }
      persist(); closeModal(); toast(existing?'Team member updated':'Team member added'); renderSettings(document.getElementById('mainContent'));
    }
  });
  if(existing){
    const del = document.getElementById('pmPersonDeleteBtn');
    if(del) del.addEventListener('click', ()=>{

      persist(); closeModal(); toast('Team member removed'); renderSettings(document.getElementById('mainContent'));
    });
  }
}

      row.addEventListener('click', ()=>{ recapViewWeekId = row.dataset.viewSnap; navigateTo('recap'); });

    {id:'data', label:'Data'}

          <div class="pr-info"><div class="pr-name">Week ${s.weekId}</div><div class="pr-proj">${fmt(fromISO(s.weekStart))} – ${fmt(fromISO(s.weekEnd))} · Finalized by ${esc(personById(s.finalizedBy)?.name||'—')} · ${s.nextSteps.length} next steps captured</div></div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-ghost btn-sm" data-view-snap="${s.weekId}">View</button>
            <button class="btn btn-danger btn-sm" data-del-snap="${s.weekId}">Delete</button>
          </div>
        </div>
      `).join('') : '<div class="empty-state">No weeks finalized yet. Finalize a week from the Weekly Recap section.</div>'}
    </div>
  `;
  document.getElementById('saveRecapSettingsBtn').onclick = ()=>{
    RECAP_SETTINGS = {
      finalizeReminders: document.getElementById('rsReminders').checked
    };
    persistAppSettings(); toast('Recap settings saved');
  };
  body.querySelectorAll('[data-view-snap]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ recapViewWeekId = btn.dataset.viewSnap; navigateTo('recap'); });
  });
  body.querySelectorAll('[data-del-snap]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openModal({
        title:'Delete this weekly snapshot?', saveLabel:'Delete snapshot',
        bodyHTML:`<p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">This permanently removes the finalized snapshot for week <b>${esc(btn.dataset.delSnap)}</b>. This can't be undone.</p>`,
        onSave:()=>{ deleteSnapshot(btn.dataset.delSnap); closeModal(); toast('Snapshot deleted'); renderSettings(document.getElementById('mainContent')); }
      });
    });
  });
}

function renderSettingsData(body){
  body.innerHTML = `
    <div class="panel-head-row"><h2 style="font-size:16px;">Export &amp; backup</h2></div>
    <div class="card" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-ghost btn-sm" id="setExportBtn">↓ Export all data (JSON)</button>
      <button class="btn btn-ghost btn-sm" id="setBackupBtn">↓ Download backup</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">↑ Import / restore backup<input type="file" id="setImportInput" accept="application/json" style="display:none;"></label>
      <span style="font-size:12px; color:var(--ink-soft);">Data is shared across everyone who opens this portal.</span>
    </div>
    <div class="panel-head-row" style="margin-top:22px;"><h2 style="font-size:16px;">Danger zone</h2></div>
    <div class="card" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-danger btn-sm" id="setResetBtn">Reset to sample data</button>
      <button class="btn btn-danger btn-sm" id="setClearBtn">Clear all local data</button>
    </div>
  `;
  document.getElementById('setExportBtn').onclick = ()=> exportBackupFile('diem-portal-data.json');
  document.getElementById('setBackupBtn').onclick = ()=> exportBackupFile(`diem-portal-backup-${toISO(TODAY)}.json`);
  document.getElementById('setImportInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        openModal({
          title:'Restore this backup?', saveLabel:'Restore backup',
          bodyHTML:`<p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">This replaces all current projects, tasks, people, and blockers with the contents of <b>${esc(file.name)}</b>. This can't be undone.</p>`,
          onSave: async ()=>{
            hydrate(parsed);
            await storageSet(STORAGE_KEY, serializeAll());
            closeModal(); toast('Backup restored'); navigateTo('settings');
          }
        });
      }catch(err){ toast('That file is not valid DIEM Portal JSON.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
  document.getElementById('setResetBtn').onclick = ()=>{
    openModal({
      title:'Reset to sample data?', saveLabel:'Reset data',
      bodyHTML:'<p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">This replaces all projects, tasks, people, and blockers with the original sample dataset. This can\'t be undone.</p>',
      onSave: async ()=>{ hydrateSeed(); await storageSet(STORAGE_KEY, serializeAll()); closeModal(); toast('Data reset'); navigateTo('settings'); }
    });
  };
  document.getElementById('setClearBtn').onclick = ()=>{
    openModal({
      title:'Clear all local data?', saveLabel:'Clear data',
      bodyHTML:'<p style="font-size:13.5px; color:var(--ink-soft); line-height:1.6;">This removes everything stored in this browser for the DIEM Portal — projects, tasks, people, weekly snapshots, and settings. This can\'t be undone.</p>',
      onSave: async ()=>{
        await storageSet(STORAGE_KEY, JSON.stringify({people:[],projects:[],tasks:[],blockers:[],requests:[],agreedPoints:[],ceoActions:[]}));
        await storageSet(WEEKLY_KEY, JSON.stringify([]));
        await storageSet(SNAPSHOT_KEY, '');
        hydrateSeed();
        WEEKLY_SNAPSHOTS = [];
        RECAP_SNAPSHOT = null;
        await storageSet(STORAGE_KEY, serializeAll());
        closeModal(); toast('Local data cleared'); navigateTo('settings');
      }
    });
  };
}
function exportBackupFile(filename){
  const blob = new Blob([serializeAll()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
/* ============================================================
   MIGRATION — read data saved by the older DIEM Command Center
   prototype (key 'diem:data:v3') and convert it into this portal's
   schema, so existing work isn't lost when switching interfaces.
   ============================================================ */
const LEGACY_CC_KEY = 'diem:data:v3';
function migrateFromCommandCenterData(raw){
  try{
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.people) || !data.people.length) return null;
    const palette = ['#FF4F14','#4747F2','#00BA9E','#B87A12','#6456A6','#14131B','#039C85'];
    const people = data.people.map((p,i)=>({
      id:p.id, name:p.name, role:p.role||'Team member',
      roleType: /ceo/i.test(p.role||'') ? 'ceo' : 'employee',
      email:'', skills:[], capacityBaseline:12,
      ringA:palette[i%palette.length], ringB:palette[(i+2)%palette.length], solid:palette[i%palette.length],
      permissions:{canCreateProjects:false, canEditTeam:false, canFinalizeRecap:false}
    }));
    const projects = (data.projects||[]).map(p=>({
      id:p.id, name:p.name, type:p.type, client:p.client||null, category:p.category||null,
      owner:p.owner, team:p.team||[], start:p.start, end:p.end,
      progressManual:{enabled:false, value:0, reason:'', by:null, date:null}
    }));
    const workloadForPriority = {high:4, medium:2, low:1};
    const tasks = (data.tasks||[]).map(t=>({
      id:t.id, project:t.project, name:t.name, assignee:t.assignee, assignee2:t.assignee2||null,
      status: t.status==='completed' ? 'done' : (t.status==='doing' ? 'in-progress' : (t.status||'not-started')),
      due: t.end || t.start, start: t.start || t.end, priority: t.priority||'medium',
      weight: t.contribution ? clamp(Math.round(t.contribution*10),1,100) : 10,
      workloadDays: workloadForPriority[t.priority]||2,
      notes: t.notes||'', blockerReason: t.status==='blocked' ? (t.notes||'Migrated from Command Center — no reason logged.') : '',
      approvalPerson:null, dependency:''
    }));
    return {people, projects, tasks, blockers:[], requests:[], agreedPoints:[]};
  }catch(e){ console.error('DIEM Portal: legacy Command Center migration failed', e); return null; }
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function init(){
  let loaded = false;
  let staleSeed = false;
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.seedVersion || parsed.seedVersion < SEED_DATA_VERSION){
        // This browser has data saved from an older version of the app — e.g. from before
        // the real operational data replaced the fictional demo dataset. Don't silently
        // keep serving that stale copy; refresh from the current seed data instead.
        staleSeed = true;
      } else {
        hydrate(parsed);
        loaded = true;
      }
    }
  }catch(err){
    console.error('DIEM Portal: could not read saved data, showing sample data instead', err);
  }
  if(!loaded && !staleSeed){
    try{
      const legacyRaw = await storageGet(LEGACY_CC_KEY);
      if(legacyRaw){
        const migrated = migrateFromCommandCenterData(legacyRaw);
        if(migrated){
          hydrate(migrated);
          loaded = true;
          await storageSet(STORAGE_KEY, serializeAll());
        }
      }
    }catch(err){ console.error('DIEM Portal: could not read legacy Command Center data', err); }
  }
  if(!loaded){
    hydrateSeed();
    if(staleSeed){
      try{ await storageSet(STORAGE_KEY, serializeAll()); }catch(err){ /* refreshed in-memory even if this particular save fails */ }
    }
  }
  else if(ensureCoreTeamMembers()){
    try{ await storageSet(STORAGE_KEY, serializeAll()); }catch(err){ /* repaired in-memory even if save fails */ }
  }

  try{
    const rawSnap = await storageGet(SNAPSHOT_KEY);
    if(rawSnap) RECAP_SNAPSHOT = JSON.parse(rawSnap);
  }catch(err){ RECAP_SNAPSHOT = null; }

  try{
    const rawWk = await storageGet(WEEKLY_KEY);
    if(rawWk) WEEKLY_SNAPSHOTS = JSON.parse(rawWk) || [];
  }catch(err){ WEEKLY_SNAPSHOTS = []; }

  try{
    const rawSettings = await storageGet(SETTINGS_KEY);
    if(rawSettings){
      const parsed = JSON.parse(rawSettings);
      if(parsed.WORKLOAD_THRESHOLDS) WORKLOAD_THRESHOLDS = parsed.WORKLOAD_THRESHOLDS;
      if(parsed.RECAP_SETTINGS) RECAP_SETTINGS = parsed.RECAP_SETTINGS;
    }
  }catch(err){ /* keep defaults */ }

  renderProfileGate();

  if(!hasWindowStorage && !CAN_PERSIST_LOCAL){
    setSaveStatus('error', "Changes won't be saved in this browser");
  } else if(loaded){
    setSaveStatus('saved');
  } else {
    setSaveStatus('saving', 'Showing sample data — edit something to start saving');
  }
}
init();

})();
